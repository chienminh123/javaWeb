<!DOCTYPE html>
<html
  lang="vi"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mẹ & Bé Yêu - Trang Chủ</title>

    <!-- Font Quicksand -->
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      th:href="@{/img/favicon.png}"
    />

    <!-- CSS Gốc -->
    <link rel="stylesheet" th:href="@{/user-css/reset.css}" />
    <link rel="stylesheet" th:href="@{/user-css/main.css}" />
    <link rel="stylesheet" th:href="@{/user-css/header.css}" />
    <link rel="stylesheet" th:href="@{/user-css/footer.css}" />

    <style>
      :root {
        --primary-color: #ff6b6b;
        --primary-hover: #ee5253;
        --secondary-color: #48dbfb;
        --bg-soft: #fff0f3;
        --text-dark: #2d3436;
        --text-gray: #636e72;
        --radius-card: 20px;
        --radius-btn: 30px;
        --shadow-soft: 0 10px 25px rgba(255, 107, 107, 0.1);
        --shadow-hover: 0 15px 35px rgba(255, 107, 107, 0.2);
      }

      body {
        font-family: "Quicksand", sans-serif;
        background-color: #fdfdfd;
        color: var(--text-dark);
      }

      .hot-deal-section {
        max-width: 1200px;
        margin: 50px auto;
        padding: 0 20px;
      }

      /* --- [SỬA ĐỔI] SECTION HEADER: Layout Ngang (Flex) --- */
      .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center; /* Căn giữa theo chiều dọc */
        margin-bottom: 30px;
        padding-bottom: 15px;
        border-bottom: 2px solid var(--bg-soft); /* Đường kẻ nhẹ phân cách */
      }

      .section-header h2 {
        font-size: 26px;
        font-weight: 700;
        color: var(--primary-color);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .section-header h2 i {
        color: #ff9f43;
      }

      /* Nút Xem Tất Cả - Mới */
      .view-all-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        font-weight: 600;
        color: var(--text-gray);
        text-decoration: none;
        padding: 8px 20px;
        border-radius: 20px;
        background-color: white;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        border: 1px solid #eee;
        transition: all 0.3s ease;
      }

      .view-all-btn:hover {
        color: white;
        background-color: var(--primary-color);
        border-color: var(--primary-color);
        transform: translateX(5px);
        box-shadow: 0 5px 15px rgba(255, 107, 107, 0.3);
      }

      /* --- GRID & CARD (GIỮ NGUYÊN STYLE ĐẸP) --- */
      .hot-deal-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 25px;
        padding-bottom: 20px;
      }

      .product-card {
        background: white;
        border-radius: var(--radius-card);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        overflow: hidden;
        text-decoration: none;
        color: var(--text-dark);
        position: relative;
        display: flex;
        flex-direction: column;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        border: 1px solid #f0f0f0;
      }

      .product-card:hover {
        transform: translateY(-10px);
        box-shadow: var(--shadow-hover);
        border-color: #ffeaa7;
      }

      .discount-sticker {
        position: absolute;
        top: 15px;
        left: 0;
        background: linear-gradient(45deg, #ff6b6b, #ff9f43);
        color: white;
        font-weight: 700;
        font-size: 12px;
        padding: 5px 12px 5px 15px;
        border-top-right-radius: 20px;
        border-bottom-right-radius: 20px;
        box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
        z-index: 5;
      }

      .product-wishlist {
        position: absolute;
        top: 15px;
        right: 15px;
        width: 35px;
        height: 35px;
        background: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #dfe6e9;
        font-size: 18px;
        z-index: 5;
        transition: 0.3s;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
      }
      .product-wishlist:hover {
        color: #ff4757;
        background: #ffeaa7;
        transform: scale(1.1);
      }

      .img-wrapper {
        width: 100%;
        height: 220px;
        padding: 25px;
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .product-card img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        transition: transform 0.6s ease;
      }

      .product-card:hover img {
        transform: scale(1.1);
      }

      .product-content {
        padding: 15px;
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .product-name {
        font-size: 16px;
        font-weight: 600;
        margin: 0 0 10px 0;
        line-height: 1.4;
        height: 44px;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        color: #2d3436;
        transition: color 0.3s;
      }

      .product-card:hover .product-name {
        color: var(--primary-color);
      }

      .price-box {
        margin-bottom: 15px;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .old-price {
        font-size: 13px;
        color: #b2bec3;
        text-decoration: line-through;
      }

      .main-price {
        color: var(--primary-color);
        font-size: 18px;
        font-weight: 700;
      }

      .add-to-cart-btn {
        width: 100%;
        padding: 10px 0;
        background: white;
        color: var(--primary-color);
        border: 2px solid var(--primary-color);
        border-radius: var(--radius-btn);
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .add-to-cart-btn:hover {
        background: var(--primary-color);
        color: white;
        box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        transform: translateY(-2px);
      }

      /* Responsive */
      @media (max-width: 992px) {
        .hot-deal-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 576px) {
        .hot-deal-grid {
          grid-template-columns: 1fr;
        }
        .section-header {
          flex-direction: column;
          gap: 15px;
          align-items: flex-start;
        }
        .view-all-btn {
          width: 100%;
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <div th:replace="User/userHeader::user-header"></div>
    <main class="main-content">
      <!-- Banner Section -->
      <section class="home-hero-section">
        <div class="home-hero-section__main">
          <div class="mega-banner-carousel" id="megaBannerCarousel">
            <div class="carousel-track" id="carouselTrack">
              <div class="mega-banner-slide">
                <img th:src="@{/img/slide-1.jpg}" class="slide-image" />
              </div>
              <div class="mega-banner-slide">
                <img th:src="@{/img/slide-2.png}" class="slide-image" />
              </div>
              <div class="mega-banner-slide">
                <img th:src="@{/img/slide-3.jpg}" class="slide-image" />
              </div>
              <div class="mega-banner-slide">
                <img th:src="@{/img/slide-4.png}" class="slide-image" />
              </div>
              <div class="mega-banner-slide">
                <img th:src="@{/img/slide-5.png}" class="slide-image" />
              </div>
            </div>
          </div>
          <div class="mega-banner__dots" id="carouselDots"></div>
        </div>

        <div class="home-hero-section__side side-banners">
          <a
            th:href="@{/products(genreId=4)}"
            class="side-banner side-banner--baby"
          >
            <button class="side-banner__button button button--outline">
              MUA NGAY
            </button>
          </a>
          <a
            th:href="@{/products(genreId=5)}"
            class="side-banner side-banner--mom"
          >
            <button class="side-banner__button button button--outline">
              MUA NGAY
            </button>
          </a>
        </div>
      </section>

      <!-- HOT DEAL SECTION -->
      <section class="hot-deal-section">
        <div class="section-header">
          <!-- Tiêu đề -->
          <h2>
            <i class="fa-solid fa-fire"></i>
            <span
              th:text="${pageTitle != null ? pageTitle : 'Sản Phẩm Bán Chạy'}"
              >Top Bán Chạy</span
            >
          </h2>

          <!-- [ĐÃ KHÔI PHỤC] Nút Xem Tất Cả -->
          <a th:href="@{/products}" class="view-all-btn">
            Xem tất cả <i class="fa-solid fa-chevron-right"></i>
          </a>
        </div>

        <div class="hot-deal-grid">
          <a
            th:href="@{/product/{id}(id=${product.productId})}"
            class="product-card"
            th:each="product, iter : ${products}"
            th:if="${iter.index < 4}"
          >
            <!-- Sticker giảm giá -->
            <span class="discount-sticker" th:if="${product.discount > 0}">
              Giảm [[${product.discount}]]%
            </span>

            <i class="far fa-heart product-wishlist"></i>

            <!-- Ảnh -->
            <div class="img-wrapper">
              <img
                th:src="@{${product.imageUrl != null ? product.imageUrl : '/img/placeholder.png'}}"
                alt="Ảnh sản phẩm"
                loading="lazy"
              />
            </div>

            <div class="product-content">
              <h3 class="product-name" th:text="${product.productName}">
                Tên sản phẩm mẫu
              </h3>

              <div class="price-box">
                <th:block th:if="${product.discount > 0}">
                  <span class="main-price">
                    <span
                      th:text="${#numbers.formatDecimal(product.getDiscountedPrice(), 0, 'COMMA', 0, 'POINT')}"
                    ></span
                    >đ
                  </span>
                  <span class="old-price">
                    <span
                      th:text="${#numbers.formatDecimal(product.sellPrice, 0, 'COMMA', 0, 'POINT')}"
                    ></span
                    >đ
                  </span>
                </th:block>

                <th:block th:unless="${product.discount > 0}">
                  <span class="main-price">
                    <span
                      th:text="${#numbers.formatDecimal(product.sellPrice, 0, 'COMMA', 0, 'POINT')}"
                    ></span
                    >đ
                  </span>
                </th:block>
              </div>

              <button class="add-to-cart-btn">
                <i class="fa-solid fa-cart-plus"></i>
                Thêm vào giỏ
              </button>
            </div>
          </a>

          <!-- Empty State -->
          <div
            th:if="${#lists.isEmpty(products)}"
            style="
              grid-column: 1 / -1;
              text-align: center;
              padding: 40px;
              color: #999;
            "
          >
            <i
              class="fa-regular fa-face-frown-open"
              style="font-size: 40px; margin-bottom: 10px"
            ></i>
            <p>Chưa có sản phẩm nổi bật nào.</p>
          </div>
        </div>
      </section>
    </main>

    <div th:replace="User/userFooter::user-footer"></div>
    <script th:src="@{/assets/js/user.js}"></script>
  </body>
</html>
