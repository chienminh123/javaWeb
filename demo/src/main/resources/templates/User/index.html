<!DOCTYPE html>
<html
  lang="vi"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mẹ & Bé Yêu - Trang Chủ</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      th:href="@{/img/favicon.png}"
    />
    <link rel="shortcut icon" type="image/png" th:href="@{/img/favicon.png}" />

    <link rel="stylesheet" th:href="@{/user-css/reset.css}" />
    <link rel="stylesheet" th:href="@{/user-css/main.css}" />
    <link rel="stylesheet" th:href="@{/user-css/header.css}" />
    <link rel="stylesheet" th:href="@{/user-css/footer.css}" />
    <link rel="stylesheet" th:href="@{/user-css/product.css}" />
  </head>
  <body>
    <div th:replace="User/userHeader::user-header"></div>
    <main class="main-content">
      <section class="home-hero-section">
        <!-- BANNER CHÍNH - SLIDE KÉO NGANG -->
        <div class="home-hero-section__main">
          <div class="mega-banner-carousel" id="megaBannerCarousel">
            <div class="carousel-track" id="carouselTrack">
              <!-- Slide 1 -->
              <div class="mega-banner-slide">
                <img
                  th:src="@{/img/slide-1.jpg}"
                  alt="Slide 1"
                  class="slide-image"
                />
              </div>

              <!-- Slide 2 -->
              <div class="mega-banner-slide">
                <img
                  th:src="@{/img/slide-2.png}"
                  alt="Slide 2"
                  class="slide-image"
                />
              </div>

              <!-- Slide 3 -->
              <div class="mega-banner-slide">
                <img
                  th:src="@{/img/slide-3.jpg}"
                  alt="Slide 3"
                  class="slide-image"
                />
              </div>

              <!-- Slide 4 -->
              <div class="mega-banner-slide">
                <img
                  th:src="@{/img/slide-4.png}"
                  alt="Slide 4"
                  class="slide-image"
                />
              </div>

              <!-- Slide 5 -->
              <div class="mega-banner-slide">
                <img
                  th:src="@{/img/slide-5.png}"
                  alt="Slide 5"
                  class="slide-image"
                />
              </div>
            </div>
          </div>

          <!-- Chấm tròn -->
          <div class="mega-banner__dots" id="carouselDots"></div>
        </div>

        <!-- 2 BANNER NHỎ BÊN PHẢI -->
        <div class="home-hero-section__side side-banners">
          <!-- Banner Cho Bé -->
          <a
            th:href="@{/products(genreId=4)}"
            class="side-banner side-banner--baby"
          >
            <button class="side-banner__button button button--outline">
              MUA NGAY
            </button>
          </a>

          <!-- Banner Cho Mẹ -->
          <a
            th:href="@{/products(genreId=5)}"
            class="side-banner side-banner--mom"
          >
            <button class="side-banner__button button button--outline">
              MUA NGAY
            </button>
          </a>
        </div>
      </section>

      <section class="hot-deal-section">
        <div class="section-header">
          <!-- Tiêu đề động (từ UserController) -->
          <h2 th:text="${pageTitle}">Hot Deal</h2>
          <a th:href="@{/products/top-selling}" class="view-all">
            Xem tất cả
            <i class="fa-solid fa-chevron-right"></i>
          </a>
        </div>

        <div class="hot-deal-carousel">
          <div class="hot-deal-grid" id="hotDealTrack">
            <!-- Lặp qua danh sách sản phẩm (Sản phẩm Bán chạy) -->
            <a
              th:href="@{/product/{id}(id=${product.productId})}"
              class="product-card"
              th:each="product : ${products}"
            >
              <i class="far fa-heart product-wishlist"></i>

              <!-- Hiển thị ảnh (th:src) -->
              <img
                th:src="@{${product.imageUrl != null ? product.imageUrl : '/img/placeholder.png'}}"
                alt="Ảnh sản phẩm"
              />

              <!-- Hiển thị tên (th:text) -->
              <h3 class="product-name" th:text="${product.productName}">
                Tên sản phẩm
              </h3>

              <div class="product-info-footer">
                <div class="price-box" style="margin: 15px 0">
                  <div th:if="${product.discount > 0}">
                    <p style="font-size: 14px; color: #666; margin-bottom: 5px">
                      Giá niêm yết:
                      <span style="text-decoration: line-through">
                        <span
                          th:text="${#numbers.formatDecimal(product.sellPrice, 0, 'COMMA', 0, 'POINT')}"
                        ></span
                        >đ
                      </span>
                    </p>

                    <div style="display: flex; align-items: center; gap: 10px">
                      <span
                        class="main-price"
                        style="
                          color: #ff4d4f;
                          font-size: 32px;
                          font-weight: bold;
                        "
                      >
                        <span
                          th:text="${#numbers.formatDecimal(product.getDiscountedPrice(), 0, 'COMMA', 0, 'POINT')}"
                        ></span
                        >đ
                      </span>

                      <span
                        style="
                          background: #ff4d4f;
                          color: white;
                          padding: 3px 8px;
                          border-radius: 4px;
                          font-size: 14px;
                          font-weight: bold;
                        "
                      >
                        Giảm [[${product.discount}]]%
                      </span>
                    </div>
                  </div>

                  <div th:unless="${product.discount > 0}">
                    <span
                      class="main-price"
                      style="color: #333; font-size: 32px; font-weight: bold"
                    >
                      <span
                        th:text="${#numbers.formatDecimal(product.sellPrice, 0, 'COMMA', 0, 'POINT')}"
                      ></span
                      >đ
                    </span>
                  </div>
                </div>
                <button class="add-to-cart">
                  <i class="fa-solid fa-bag-shopping"></i>
                </button>
              </div>
            </a>

            <!-- Thêm thông báo nếu không có sản phẩm nào -->
            <div
              th:if="${#lists.isEmpty(products)}"
              style="text-align: center; width: 100%; padding: 50px"
            >
              <p>Không tìm thấy sản phẩm bán chạy nào.</p>
            </div>
          </div>
          <!-- (Các nút carousel giữ nguyên) -->
          <button class="carousel-nav carousel-nav--prev" id="hotDealPrev">
            <i class="fas fa-chevron-left"></i>
          </button>
          <button class="carousel-nav carousel-nav--next" id="hotDealNext">
            <i class="fas fa-chevron-right"></i>
          </button>
        </div>
      </section>
    </main>
    <div th:replace="User/userFooter::user-footer"></div>
    <script th:src="@{/assets/js/user.js}"></script>
  </body>
</html>
