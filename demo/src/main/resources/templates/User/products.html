<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Sản Phẩm - Mẹ & Bé Yêu</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      th:href="@{/img/favicon.png}"
    />
    <link rel="shortcut icon" type="image/png" th:href="@{/img/favicon.png}" />

    <link rel="stylesheet" th:href="@{/user-css/reset.css}" />
    <link rel="stylesheet" th:href="@{/user-css/main.css}" />
    <link rel="stylesheet" th:href="@{/user-css/header.css}" />
    <link rel="stylesheet" th:href="@{/user-css/footer.css}" />
    <link rel="stylesheet" th:href="@{/user-css/product.css}" />

    <style>
      .product-page-layout {
        display: flex;
        gap: 20px;
        max-width: 1200px;
        margin: 20px auto;
      }
      .filter-sidebar {
        width: 250px;
        flex-shrink: 0;
      }
      .filter-sidebar .filter-group {
        background: #f9f9f9;
        border: 1px solid #eee;
        padding: 15px;
        margin-bottom: 15px;
        border-radius: 5px;
      }
      .filter-sidebar h3 {
        font-size: 16px;
        font-weight: bold;
        margin: 0 0 10px 0;
        padding-bottom: 10px;
        border-bottom: 1px solid #ddd;
      }
      .filter-sidebar ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .filter-sidebar li {
        margin-bottom: 8px;
      }
      .filter-sidebar a {
        text-decoration: none;
        color: #333;
        display: block; /* Giúp toàn bộ dòng là link */
      }
      /* Style cho thể loại đang được chọn */
      .filter-sidebar li.active a,
      .filter-sidebar a.active-link-style {
        color: #ff4d4f; /* Màu chủ đạo */
        font-weight: bold;
      }

      .product-grid-main {
        flex-grow: 1;
      }
      .grid-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #ddd;
        padding-bottom: 10px;
      }
      .grid-header h2 {
        font-size: 20px;
        margin: 0;
      }
      /* (Style cho các nút sắp xếp giống ảnh) */
      .sort-options {
        display: flex;
        gap: 5px;
        align-items: center;
      }
      .sort-options a.sort-btn {
        /* Dùng <a> thay vì <button> */
        padding: 5px 10px;
        border: 1px solid #ddd;
        background: #fff;
        cursor: pointer;
        text-decoration: none;
        color: #333;
        border-radius: 3px;
      }
      .sort-options a.sort-btn.active {
        background: #ff4d4f;
        color: white;
        border-color: #ff4d4f;
      }

      /* Dùng lại style .hot-deal-grid từ file product.css */
      .hot-deal-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr); /* 4 cột (Giống ảnh) */
        gap: 15px;
        margin-top: 20px;
      }

      /* Breadcrumbs (Thanh Trang Chủ > Sữa cho bé) */
      .breadcrumbs {
        padding: 15px 0;
        color: #888;
        font-size: 14px;
      }
      .breadcrumbs a {
        text-decoration: none;
        color: #555;
      }
      .breadcrumbs a:hover {
        color: #ff4d4f;
      }
      .breadcrumbs span {
        margin: 0 5px;
      }
    </style>
  </head>
  <body>
    <div th:replace="User/userHeader::user-header"></div>

    <div style="max-width: 1200px; margin: 0 auto; padding: 0 10px">
      <div class="breadcrumbs">
        <a th:href="@{/User/index}">Trang Chủ</a>
        <span>&gt;</span>
        <span th:text="${pageTitle}">Sữa cho bé</span>
      </div>
    </div>

    <main class="main-content product-page-layout">
      <aside class="filter-sidebar">
        <div class="filter-group">
          <h3>Khoảng giá</h3>
          <ul>
            <li>
              <a
                th:href="@{/products(genreId=${currentGenreId}, sort=${param.sort}, brandId=${param.brandId}, priceRange='0-500000')}"
                th:classappend="${param.priceRange == '0-500000'} ? 'active-link-style' : ''"
              >
                Dưới 500.000đ
              </a>
            </li>
            <li>
              <a
                th:href="@{/products(genreId=${currentGenreId}, sort=${param.sort}, brandId=${param.brandId}, priceRange='500000-1000000')}"
                th:classappend="${param.priceRange == '500000-1000000'} ? 'active-link-style' : ''"
              >
                500.000đ - 1.000.000đ
              </a>
            </li>
            <li>
              <a
                th:href="@{/products(genreId=${currentGenreId}, sort=${param.sort}, brandId=${param.brandId}, priceRange='1000000-max')}"
                th:classappend="${param.priceRange == '1000000-max'} ? 'active-link-style' : ''"
              >
                Trên 1.000.000đ
              </a>
            </li>
            <li>
              <a
                th:href="@{/products(genreId=${currentGenreId}, sort=${param.sort}, brandId=${param.brandId})}"
                style="color: #dc3545; font-size: 0.9em"
                th:if="${param.priceRange != null}"
              >
                (Xóa lọc giá)
              </a>
            </li>
          </ul>
        </div>

        <div class="filter-group">
          <h3>Thương hiệu</h3>
          <ul>
            <li th:each="provider : ${providerList}">
              <a
                th:href="@{/products(genreId=${currentGenreId}, sort=${param.sort}, priceRange=${param.priceRange}, brandId=${provider.providerId})}"
                th:classappend="${param.brandId != null and param.brandId == provider.providerId} ? 'active-link-style' : ''"
              >
                <span th:text="${provider.providerName}">Tên NCC</span>
              </a>
            </li>
            <li>
              <a
                th:href="@{/products(genreId=${currentGenreId}, sort=${param.sort}, priceRange=${param.priceRange})}"
                style="color: #dc3545; font-size: 0.9em"
                th:if="${param.brandId != null}"
              >
                (Xóa lọc thương hiệu)
              </a>
            </li>
          </ul>
        </div>
      </aside>

      <section class="product-grid-main">
        <div class="grid-header">
          <h2 th:text="${pageTitle}">Sản Phẩm</h2>
          <div class="sort-options">
            <span style="font-size: 14px">Sắp xếp:</span>

            <a
              th:href="@{/products(genreId=${currentGenreId}, brandId=${param.brandId}, priceRange=${param.priceRange}, sort='price_asc')}"
              th:classappend="${param.sort == 'price_asc'} ? 'active' : ''"
              class="sort-btn"
            >
              Giá thấp - cao
            </a>

            <a
              th:href="@{/products(genreId=${currentGenreId}, brandId=${param.brandId}, priceRange=${param.priceRange}, sort='price_desc')}"
              th:classappend="${param.sort == 'price_desc'} ? 'active' : ''"
              class="sort-btn"
            >
              Giá cao - thấp
            </a>
          </div>
        </div>

        <div class="hot-deal-grid" id="productGrid">
          <a
            th:href="@{/product/{id}(id=${product.productId})}"
            class="product-card"
            th:each="product : ${products}"
          >
            <i class="far fa-heart product-wishlist"></i>
            <img
              th:src="@{${product.imageUrl != null ? product.imageUrl : '/img/placeholder.png'}}"
              alt="Ảnh sản phẩm"
            />
            <h3 class="product-name" th:text="${product.productName}">...</h3>
            <div class="product-info-footer">
              <p
                class="product-price"
                th:text="${#numbers.formatDecimal(product.sellPrice, 0, 'COMMA', 0, 'POINT')} + 'đ'"
              >
                ...
              </p>
              <button type="submit" class="add-to-cart">
                <i class="fa-solid fa-bag-shopping"></i>
              </button>
            </div>
          </a>

          <div
            th:if="${#lists.isEmpty(products)}"
            style="
              text-align: center;
              width: 100%;
              padding: 50px;
              grid-column: 1 / -1;
            "
          >
            <p>Không tìm thấy sản phẩm nào theo tiêu chí lọc này.</p>
          </div>
        </div>
      </section>
    </main>
    <div th:replace="User/userFooter::user-footer"></div>
    <script th:src="@{/assets/js/user.js}"></script>
  </body>
</html>
