<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Sản Phẩm - Mẹ & Bé Yêu</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Font Quicksand -->
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      th:href="@{/img/favicon.png}"
    />

    <!-- CSS Gốc -->
    <link rel="stylesheet" th:href="@{/user-css/reset.css}" />
    <link rel="stylesheet" th:href="@{/user-css/main.css}" />
    <link rel="stylesheet" th:href="@{/user-css/header.css}" />
    <link rel="stylesheet" th:href="@{/user-css/footer.css}" />

    <style>
      /* --- COPY STYLE TỪ TRANG CHỦ (ĐỒNG BỘ UI) --- */
      :root {
        --primary-color: #ff6b6b;
        --primary-hover: #ee5253;
        --secondary-color: #48dbfb;
        --bg-soft: #fff0f3;
        --text-dark: #2d3436;
        --text-gray: #636e72;
        --radius-card: 20px;
        --radius-btn: 30px;
        --shadow-soft: 0 10px 25px rgba(255, 107, 107, 0.1);
        --shadow-hover: 0 15px 35px rgba(255, 107, 107, 0.2);
      }

      body {
        font-family: "Quicksand", sans-serif;
        background-color: #fcfcfc;
        color: var(--text-dark);
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 15px;
      }

      /* --- BREADCRUMBS --- */
      .breadcrumbs {
        padding: 25px 0;
        font-size: 15px;
        color: var(--text-gray);
        display: flex;
        align-items: center;
      }
      .breadcrumbs a {
        text-decoration: none;
        color: var(--text-gray);
        transition: 0.3s;
        font-weight: 500;
      }
      .breadcrumbs a:hover {
        color: var(--primary-color);
      }
      .breadcrumbs span.separator {
        margin: 0 12px;
        font-size: 12px;
        color: #e0e0e0;
      }
      .breadcrumbs span.current {
        font-weight: 700;
        color: var(--primary-color);
      }

      /* --- LAYOUT: SIDEBAR & MAIN --- */
      .product-page-layout {
        display: flex;
        gap: 35px;
        margin-bottom: 60px;
        align-items: flex-start;
      }

      .filter-sidebar {
        width: 270px;
        flex-shrink: 0;
      }

      .product-grid-main {
        flex: 1;
        min-width: 0;
      }

      @media (max-width: 992px) {
        .product-page-layout {
          flex-direction: column;
        }
        .filter-sidebar {
          width: 100%;
          margin-bottom: 30px;
        }
      }

      /* --- SIDEBAR STYLE MỚI --- */
      .filter-group {
        background: #fff;
        border-radius: var(--radius-card);
        padding: 25px;
        margin-bottom: 25px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.03);
        border: 1px solid #f5f5f5;
      }

      .filter-group h3 {
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 20px;
        padding-bottom: 12px;
        border-bottom: 2px dashed #ffeaa7; /* Gạch nét đứt dễ thương */
        color: var(--text-dark);
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .filter-group h3 i {
        color: var(--primary-color);
      }

      .filter-list {
        list-style: none;
        padding: 0;
      }

      .filter-link {
        display: flex;
        align-items: center;
        padding: 10px 15px;
        border-radius: 12px;
        text-decoration: none;
        color: var(--text-gray);
        transition: all 0.3s ease;
        font-weight: 500;
        margin-bottom: 8px;
        background: transparent;
      }

      .filter-link:hover {
        background-color: var(--bg-soft);
        color: var(--primary-color);
        padding-left: 20px; /* Hiệu ứng trượt nhẹ */
      }

      .filter-link.active-link-style {
        background: linear-gradient(45deg, var(--primary-color), #ff9f43);
        color: #fff;
        box-shadow: 0 4px 10px rgba(255, 107, 107, 0.3);
      }

      .clear-filter {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        margin-top: 15px;
        font-size: 14px;
        color: #e17055;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
      }

      /* --- GRID HEADER (Sắp xếp) --- */
      .grid-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
        background: #fff;
        padding: 20px 25px;
        border-radius: var(--radius-card);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.03);
        flex-wrap: wrap;
        gap: 15px;
      }

      .grid-header h2 {
        font-size: 24px;
        font-weight: 700;
        color: var(--primary-color);
        margin: 0;
      }

      .sort-options {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .sort-label {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-dark);
      }

      .sort-btn {
        padding: 8px 18px;
        border: 1px solid #eee;
        background: #fff;
        border-radius: 20px;
        text-decoration: none;
        color: var(--text-gray);
        font-size: 14px;
        font-weight: 600;
        transition: all 0.3s;
      }
      .sort-btn:hover {
        border-color: var(--primary-color);
        color: var(--primary-color);
      }
      .sort-btn.active {
        background: var(--primary-color);
        color: white;
        border-color: var(--primary-color);
        box-shadow: 0 5px 10px rgba(255, 107, 107, 0.2);
      }

      /* --- PRODUCT GRID (4 CỘT CỐ ĐỊNH) --- */
      .product-grid {
        display: grid;
        /* Yêu cầu: 4 sản phẩm 1 dòng trên desktop */
        grid-template-columns: repeat(4, 1fr);
        gap: 25px;
        margin-bottom: 40px;
      }

      /* --- PRODUCT CARD (GIỐNG TRANG CHỦ) --- */
      .product-card {
        background: white;
        border-radius: var(--radius-card);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        overflow: hidden;
        text-decoration: none;
        color: var(--text-dark);
        position: relative;
        display: flex;
        flex-direction: column;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        border: 1px solid #f0f0f0;
      }

      .product-card:hover {
        transform: translateY(-10px);
        box-shadow: var(--shadow-hover);
        border-color: #ffeaa7;
      }

      /* Sticker */
      .discount-sticker {
        position: absolute;
        top: 15px;
        left: 0;
        background: linear-gradient(45deg, #ff6b6b, #ff9f43);
        color: white;
        font-weight: 700;
        font-size: 12px;
        padding: 5px 12px 5px 15px;
        border-top-right-radius: 20px;
        border-bottom-right-radius: 20px;
        box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
        z-index: 5;
      }

      .product-wishlist {
        position: absolute;
        top: 15px;
        right: 15px;
        width: 35px;
        height: 35px;
        background: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #dfe6e9;
        font-size: 18px;
        z-index: 5;
        transition: 0.3s;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
      }
      .product-wishlist:hover {
        color: #ff4757;
        background: #ffeaa7;
      }

      /* Image */
      .img-wrapper {
        width: 100%;
        height: 220px;
        padding: 25px;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .product-card img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        transition: transform 0.6s ease;
      }
      .product-card:hover img {
        transform: scale(1.1);
      }

      /* Info */
      .product-content {
        padding: 15px;
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .product-name {
        font-size: 16px;
        font-weight: 600;
        margin: 0 0 10px 0;
        line-height: 1.4;
        height: 44px;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        color: #2d3436;
        transition: color 0.3s;
      }
      .product-card:hover .product-name {
        color: var(--primary-color);
      }

      .price-box {
        margin-bottom: 15px;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .old-price {
        font-size: 13px;
        color: #b2bec3;
        text-decoration: line-through;
      }
      .main-price {
        color: var(--primary-color);
        font-size: 18px;
        font-weight: 700;
      }

      .add-to-cart-btn {
        width: 100%;
        padding: 10px 0;
        background: white;
        color: var(--primary-color);
        border: 2px solid var(--primary-color);
        border-radius: var(--radius-btn);
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .add-to-cart-btn:hover {
        background: var(--primary-color);
        color: white;
        box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        transform: translateY(-2px);
      }

      /* --- PAGINATION (PHÂN TRANG) --- */
      .pagination-container {
        display: flex;
        justify-content: center;
        margin-top: 40px;
      }

      .pagination {
        display: flex;
        list-style: none;
        padding: 0;
        gap: 8px;
        background: #fff;
        padding: 10px 20px;
        border-radius: 30px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
      }

      .page-item a {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        text-decoration: none;
        color: var(--text-gray);
        font-weight: 600;
        transition: all 0.3s;
        border: 1px solid transparent;
      }

      .page-item a:hover {
        background: var(--bg-soft);
        color: var(--primary-color);
      }

      .page-item.active a {
        background: var(--primary-color);
        color: white;
        box-shadow: 0 4px 10px rgba(255, 107, 107, 0.3);
      }

      .page-item.disabled a {
        color: #ccc;
        cursor: not-allowed;
        background: none;
      }

      /* --- RESPONSIVE --- */
      @media (max-width: 1200px) {
        .product-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }
      @media (max-width: 768px) {
        .product-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 480px) {
        .product-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div th:replace="User/userHeader::user-header"></div>

    <div class="container">
      <div class="breadcrumbs">
        <a th:href="@{/User/index}"
          ><i class="fa-solid fa-house"></i> Trang Chủ</a
        >
        <span class="separator"><i class="fa-solid fa-chevron-right"></i></span>
        <span
          class="current"
          th:text="${pageTitle != null ? pageTitle : 'Sản phẩm'}"
          >Sản phẩm</span
        >
      </div>
    </div>

    <main class="container product-page-layout">
      <!-- SIDEBAR -->
      <aside class="filter-sidebar">
        <!-- Filter Price -->
        <div class="filter-group">
          <h3><i class="fa-solid fa-sack-dollar"></i> Khoảng giá</h3>
          <ul class="filter-list">
            <li>
              <a
                th:href="@{/products(genreId=${currentGenreId}, sort=${param.sort}, brandId=${param.brandId}, priceRange='0-500000')}"
                class="filter-link"
                th:classappend="${param.priceRange != null && param.priceRange[0] == '0-500000'} ? 'active-link-style' : ''"
              >
                Dưới 500.000đ
              </a>
            </li>
            <li>
              <a
                th:href="@{/products(genreId=${currentGenreId}, sort=${param.sort}, brandId=${param.brandId}, priceRange='500000-1000000')}"
                class="filter-link"
                th:classappend="${param.priceRange != null && param.priceRange[0] == '500000-1000000'} ? 'active-link-style' : ''"
              >
                500k - 1 Triệu
              </a>
            </li>
            <li>
              <a
                th:href="@{/products(genreId=${currentGenreId}, sort=${param.sort}, brandId=${param.brandId}, priceRange='1000000-max')}"
                class="filter-link"
                th:classappend="${param.priceRange != null && param.priceRange[0] == '1000000-max'} ? 'active-link-style' : ''"
              >
                Trên 1 Triệu
              </a>
            </li>
            <li th:if="${param.priceRange != null}">
              <a
                th:href="@{/products(genreId=${currentGenreId}, sort=${param.sort}, brandId=${param.brandId})}"
                class="clear-filter"
              >
                <i class="fa-solid fa-times-circle"></i> Bỏ lọc giá
              </a>
            </li>
          </ul>
        </div>

        <!-- Filter Brand -->
        <div class="filter-group">
          <h3><i class="fa-solid fa-tags"></i> Thương hiệu</h3>
          <ul class="filter-list">
            <li th:each="provider : ${providerList}">
              <a
                th:href="@{/products(genreId=${currentGenreId}, sort=${param.sort}, priceRange=${param.priceRange}, brandId=${provider.providerId})}"
                class="filter-link"
                th:classappend="${param.brandId != null and param.brandId[0] == (provider.providerId + '')} ? 'active-link-style' : ''"
              >
                <span th:text="${provider.providerName}">Tên NCC</span>
              </a>
            </li>
            <li th:if="${param.brandId != null}">
              <a
                th:href="@{/products(genreId=${currentGenreId}, sort=${param.sort}, priceRange=${param.priceRange})}"
                class="clear-filter"
              >
                <i class="fa-solid fa-times-circle"></i> Bỏ lọc thương hiệu
              </a>
            </li>
          </ul>
        </div>
      </aside>

      <!-- MAIN CONTENT -->
      <section class="product-grid-main">
        <div class="grid-header">
          <h2 th:text="${pageTitle != null ? pageTitle : 'Tất Cả Sản Phẩm'}">
            Danh Sách Sản Phẩm
          </h2>
          <div class="sort-options">
            <span class="sort-label">Sắp xếp:</span>
            <a
              th:href="@{/products(genreId=${currentGenreId}, brandId=${param.brandId}, priceRange=${param.priceRange}, sort='price_asc')}"
              th:classappend="${param.sort != null && param.sort[0] == 'price_asc'} ? 'active' : ''"
              class="sort-btn"
            >
              <i class="fa-solid fa-arrow-up-short-wide"></i> Giá thấp
            </a>
            <a
              th:href="@{/products(genreId=${currentGenreId}, brandId=${param.brandId}, priceRange=${param.priceRange}, sort='price_desc')}"
              th:classappend="${param.sort != null && param.sort[0] == 'price_desc'} ? 'active' : ''"
              class="sort-btn"
            >
              <i class="fa-solid fa-arrow-down-wide-short"></i>
              Giá cao
            </a>
          </div>
        </div>

        <!-- GRID SẢN PHẨM 4 CỘT -->
        <div class="product-grid" id="productGrid">
          <!-- Loop sản phẩm -->
          <a
            th:href="@{/product/{id}(id=${product.productId})}"
            class="product-card"
            th:each="product : ${products}"
          >
            <!-- Sticker -->
            <span class="discount-sticker" th:if="${product.discount > 0}">
              -[[${product.discount}]]%
            </span>

            <i class="far fa-heart product-wishlist"></i>

            <div class="img-wrapper">
              <img
                th:src="@{${product.imageUrl != null ? product.imageUrl : '/img/placeholder.png'}}"
                alt="Ảnh sản phẩm"
                loading="lazy"
              />
            </div>

            <div class="product-content">
              <h3 class="product-name" th:text="${product.productName}">
                Tên sản phẩm
              </h3>

              <div class="price-box">
                <th:block th:if="${product.discount > 0}">
                  <span class="main-price">
                    <span
                      th:text="${#numbers.formatDecimal(product.getDiscountedPrice(), 0, 'COMMA', 0, 'POINT')}"
                    ></span
                    >đ
                  </span>
                  <span class="old-price">
                    <span
                      th:text="${#numbers.formatDecimal(product.sellPrice, 0, 'COMMA', 0, 'POINT')}"
                    ></span
                    >đ
                  </span>
                </th:block>
                <th:block th:unless="${product.discount > 0}">
                  <span class="main-price">
                    <span
                      th:text="${#numbers.formatDecimal(product.sellPrice, 0, 'COMMA', 0, 'POINT')}"
                    ></span
                    >đ
                  </span>
                </th:block>
              </div>

              <button class="add-to-cart-btn">
                <i class="fa-solid fa-cart-plus"></i> Thêm vào giỏ
              </button>
            </div>
          </a>

          <!-- Empty State -->
          <div
            th:if="${#lists.isEmpty(products)}"
            style="
              grid-column: 1 / -1;
              text-align: center;
              padding: 60px;
              background: white;
              border-radius: 20px;
            "
          >
            <i
              class="fa-solid fa-box-open"
              style="font-size: 50px; color: #ddd; margin-bottom: 15px"
            ></i>
            <p style="color: #666">Không tìm thấy sản phẩm nào phù hợp.</p>
          </div>
        </div>

        <!-- PHÂN TRANG (PAGINATION UI) -->
        <!-- 
                   LƯU Ý Backend: Cần trả về đối tượng Page<Product> hoặc biến totalPages, currentPage
                   Đoạn code dưới giả định bạn có các biến này.
                -->
        <div class="pagination-container" th:if="${totalPages > 1}">
          <!-- Chỉ hiện nếu > 1 trang -->
          <ul class="pagination">
            <!-- Nút Previous -->
            <li
              class="page-item"
              th:classappend="${currentPage == 1} ? 'disabled' : ''"
            >
              <a
                th:href="@{/products(page=${currentPage - 1}, genreId=${currentGenreId}, sort=${param.sort}, brandId=${param.brandId}, priceRange=${param.priceRange})}"
              >
                <i class="fa-solid fa-chevron-left"></i>
              </a>
            </li>

            <!-- Loop Trang (Hiển thị cơ bản) -->
            <li
              class="page-item"
              th:each="i : ${#numbers.sequence(1, totalPages)}"
              th:classappend="${currentPage == i} ? 'active' : ''"
            >
              <a
                th:href="@{/products(page=${i}, genreId=${currentGenreId}, sort=${param.sort}, brandId=${param.brandId}, priceRange=${param.priceRange})}"
                th:text="${i}"
                >1</a
              >
            </li>

            <!-- Nút Next -->
            <li
              class="page-item"
              th:classappend="${currentPage == totalPages} ? 'disabled' : ''"
            >
              <a
                th:href="@{/products(page=${currentPage + 1}, genreId=${currentGenreId}, sort=${param.sort}, brandId=${param.brandId}, priceRange=${param.priceRange})}"
              >
                <i class="fa-solid fa-chevron-right"></i>
              </a>
            </li>
          </ul>
        </div>
      </section>
    </main>

    <div th:replace="User/userFooter::user-footer"></div>
    <script th:src="@{/assets/js/user.js}"></script>
  </body>
</html>
