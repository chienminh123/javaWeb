<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Thanh toán đơn hàng - Bibo Mart</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" th:href="@{/user-css/reset.css}" />
    <link rel="stylesheet" th:href="@{/user-css/main.css}" />
    <link rel="stylesheet" th:href="@{/user-css/header.css}" />
    <link rel="stylesheet" th:href="@{/user-css/footer.css}" />
    <link rel="stylesheet" th:href="@{/user-css/checkout.css}" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <style>
      /* CSS form nằm ngang */
      .form-group {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-bottom: 15px;
      }
      .form-group label {
        min-width: 140px;
        margin-bottom: 0;
        font-weight: 600;
        color: #333;
        white-space: nowrap;
      }
      .form-group input,
      .form-group textarea {
        flex: 1;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
        outline: none;
      }
      .form-group textarea {
        resize: vertical;
      }
      .form-group:has(textarea) {
        align-items: flex-start;
      }
      .form-group:has(textarea) label {
        margin-top: 10px;
      }
      @media (max-width: 600px) {
        .form-group {
          flex-direction: column;
          align-items: flex-start;
        }
        .form-group label {
          margin-bottom: 5px;
        }
        .form-group input,
        .form-group textarea {
          width: 100%;
        }
      }

      /* CSS Coupon */
      .coupon-box {
        background: #fff;
        padding: 15px;
        border-radius: 8px;
        border: 1px dashed #ccc;
        margin: 15px 0;
      }
      .coupon-input-group {
        display: flex;
        gap: 8px;
      }
      .coupon-input-group input {
        flex: 1;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
        text-transform: uppercase;
        font-weight: bold;
      }
      .btn-apply {
        background: #333;
        color: white;
        border: none;
        padding: 0 15px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 600;
      }
      .btn-my-coupon {
        background: #fff0f1;
        color: #ff424e;
        border: 1px solid #ff424e;
        padding: 0 15px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 600;
        white-space: nowrap;
      }
      .coupon-message {
        font-size: 13px;
        margin-top: 8px;
        font-weight: 500;
      }

      /* Modal */
      .coupon-list {
        max-height: 300px;
        overflow-y: auto;
        padding: 0;
        list-style: none;
      }
      .coupon-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px;
        border-bottom: 1px solid #eee;
      }
      .coupon-item:last-child {
        border-bottom: none;
      }
      .coupon-code {
        color: #ff424e;
        font-weight: bold;
        font-size: 16px;
      }
      .coupon-desc {
        font-size: 12px;
        color: #666;
      }
      .btn-use-now {
        background: #ff424e;
        color: white;
        border: none;
        padding: 5px 12px;
        border-radius: 20px;
        font-size: 12px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div th:replace="User/userHeader::user-header"></div>

    <main class="checkout-wrapper">
      <div class="checkout-steps">
        <div class="step active">
          <div class="step-number">1</div>
          <div class="step-title">Giỏ hàng</div>
        </div>
        <div class="step active">
          <div class="step-number">2</div>
          <div class="step-title">Thanh toán</div>
        </div>
        <div class="step">
          <div class="step-number">3</div>
          <div class="step-title">Hoàn tất</div>
        </div>
      </div>

      <div class="back-to-cart-top" style="margin-bottom: 20px">
        <a th:href="@{/cart}" class="btn-back-cart"
          ><i class="fas fa-arrow-left"></i> Quay lại giỏ hàng</a
        >
      </div>

      <div class="checkout-container">
        <div class="checkout-form-area">
          <h1>THANH TOÁN ĐƠN HÀNG</h1>

          <form
            th:action="@{/checkout/confirm}"
            method="POST"
            id="checkoutForm"
          >
            <input
              type="hidden"
              th:name="${_csrf.parameterName}"
              th:value="${_csrf.token}"
            />

            <input
              type="hidden"
              id="rawTotalPrice"
              th:value="${totalPrice != null ? totalPrice : 0}"
            />

            <input type="hidden" name="couponCode" id="hiddenCouponCode" />
            <th:block th:if="${cart != null and cart.cartDetails != null}">
              <input
                type="hidden"
                name="selectedItems"
                th:each="item : ${cart.cartDetails}"
                th:value="${item.cartDetailId}"
              />
            </th:block>

            <div class="form-group">
              <label for="name"
                >Họ và tên <span style="color: #ff424e">*</span></label
              >
              <input
                type="text"
                id="name"
                name="name"
                th:value="${currentUser?.userName}"
                required
              />
            </div>
            <div class="form-group">
              <label for="phone"
                >Số điện thoại <span style="color: #ff424e">*</span></label
              >
              <input
                type="text"
                id="phone"
                name="phone"
                th:value="${currentUser?.phone}"
                required
              />
            </div>
            <div class="form-group">
              <label for="address"
                >Địa chỉ <span style="color: #ff424e">*</span></label
              >
              <input
                type="text"
                id="address"
                name="address"
                th:value="${currentUser?.address}"
                required
              />
            </div>
            <div class="form-group">
              <label for="note">Ghi chú</label>
              <textarea id="note" name="note" rows="3"></textarea>
            </div>

            <h2>Phương thức thanh toán</h2>
            <div class="payment-methods">
              <label class="payment-option active">
                <input type="radio" name="paymentMethod" value="COD" checked />
                <span
                  ><i class="fas fa-box"></i> Thanh toán khi nhận hàng
                  (COD)</span
                >
              </label>
              <label class="payment-option">
                <input type="radio" name="paymentMethod" value="VNPay" />
                <span><i class="fas fa-qrcode"></i> Thanh toán VNPay</span>
              </label>
            </div>
            <div class="trust-badges">
              <div><i class="fas fa-undo"></i> Đổi trả miễn phí 30 ngày</div>
              <div><i class="fas fa-certificate"></i> Hàng chính hãng 100%</div>
              <div><i class="fas fa-heart"></i> 68.000+ mẹ bỉm tin dùng</div>
            </div>
            <button type="submit" class="confirm-btn">
              <i class="fas fa-check-circle"></i> XÁC NHẬN ĐẶT HÀNG
            </button>
          </form>
        </div>

        <div class="checkout-summary-area">
          <div class="summary-header">
            <h2><i class="fas fa-shopping-bag"></i> Đơn hàng</h2>
            <span
              class="item-count"
              th:text="${cart?.cartDetails?.size() ?: 0} + ' sản phẩm'"
            ></span>
          </div>

          <div
            class="summary-items-mini"
            th:if="${cart != null and !cart.cartDetails.isEmpty()}"
          >
            <div class="mini-item" th:each="item : ${cart.cartDetails}">
              <img
                th:src="@{${item.product?.imageUrl ?: '/img/placeholder.png'}}"
              />
              <div class="mini-info">
                <div
                  class="mini-name"
                  th:text="${item.product?.productName}"
                ></div>
                <div
                  class="mini-meta"
                  th:text="'Size: ' + ${item.sizes?.sizeName} + ' × ' + ${item.quantity}"
                ></div>
              </div>
              <div
                class="mini-price"
                th:text="${#numbers.formatDecimal(item.price * item.quantity, 0, 'COMMA', 0, 'POINT')} + 'đ'"
              ></div>
            </div>
          </div>

          <div class="coupon-box">
            <button
              type="button"
              class="btn-my-coupon"
              onclick="openCouponModal()"
              style="margin-bottom: 10px"
            >
              <i class="fas fa-ticket-alt"></i> Kho mã của tôi
            </button>
            <div class="coupon-input-group">
              <input type="text" id="couponInput" placeholder="Mã giảm giá" />
              <button type="button" class="btn-apply" onclick="applyCoupon()">
                Áp dụng
              </button>
            </div>
            <div id="couponMessage" class="coupon-message"></div>
          </div>

          <div class="summary-total-big">
            <div class="label">Tổng thanh toán</div>
            <div
              class="amount"
              id="finalTotalDisplay"
              th:text="${#numbers.formatDecimal(totalPrice, 0, 'COMMA', 0, 'POINT')} + 'đ'"
            >
              0đ
            </div>
          </div>
        </div>
      </div>

      <div id="couponListModal" class="summary-modal">
        <div class="modal-content" style="max-width: 450px">
          <div class="modal-header">
            <h3><i class="fas fa-ticket-alt"></i> Mã giảm giá của bạn</h3>
            <span
              class="close-btn"
              onclick="document.getElementById('couponListModal').classList.remove('active')"
              >&times;</span
            >
          </div>
          <div class="modal-body">
            <ul
              class="coupon-list"
              th:if="${userCoupons != null and !userCoupons.isEmpty()}"
            >
              <li class="coupon-item" th:each="c : ${userCoupons}">
                <div>
                  <div class="coupon-code" th:text="${c.code}">CODE</div>
                  <div class="coupon-desc">
                    <span
                      th:if="${c.discountType == 'PERCENT'}"
                      th:text="'Giảm ' + ${c.discountValue} + '%'"
                    ></span>
                    <span
                      th:if="${c.discountType == 'FIXED'}"
                      th:text="'Giảm ' + ${#numbers.formatDecimal(c.discountValue, 0, 'COMMA', 0, 'POINT')} + 'đ'"
                    ></span>
                    <br />
                    <small th:text="'HSD: ' + ${c.endDate}"></small>
                  </div>
                </div>
                <button
                  type="button"
                  class="btn-use-now"
                  th:onclick="selectCoupon([[${c.code}]])"
                >
                  Dùng ngay
                </button>
              </li>
            </ul>
            <div
              th:if="${userCoupons == null or userCoupons.isEmpty()}"
              style="text-align: center; padding: 20px; color: #999"
            >
              Không có mã giảm giá khả dụng.
            </div>
          </div>
        </div>
      </div>
    </main>

    <div th:replace="User/userFooter::user-footer"></div>

    <script th:inline="javascript">
      let originalTotal = 0;

      document.addEventListener("DOMContentLoaded", function () {
        const priceInput = document.getElementById("rawTotalPrice");
        if (priceInput) {
          // Cách 1: Lấy từ Input ẩn (An toàn nhất)
          originalTotal = parseFloat(priceInput.value);
        } else {
          // Cách 2: Fallback dùng comment Thymeleaf để tránh lỗi đỏ IDE
          originalTotal = /*[[${totalPrice != null ? totalPrice : 0}]]*/ 0;
        }
        console.log("Original Total:", originalTotal);
      });

      function applyCoupon() {
        const code = document.getElementById("couponInput").value.trim();
        const msg = document.getElementById("couponMessage");

        // Đảm bảo có giá trị total
        if (!originalTotal || originalTotal === 0) {
          const priceInput = document.getElementById("rawTotalPrice");
          if (priceInput) originalTotal = parseFloat(priceInput.value);
        }

        if (!code) {
          msg.innerText = "Vui lòng nhập mã.";
          msg.style.color = "red";
          return;
        }

        msg.innerText = "Đang kiểm tra...";
        msg.style.color = "#666";

        fetch(`/api/coupon/check?code=${code}&total=${originalTotal}`)
          .then((res) => res.json())
          .then((data) => {
            if (data.valid) {
              const discountText = new Intl.NumberFormat("vi-VN").format(
                data.discountAmount
              );
              msg.innerText = `Áp dụng thành công! ${data.messageText} (-${discountText}đ)`;
              msg.style.color = "green";

              const newTotalText = new Intl.NumberFormat("vi-VN").format(
                data.newTotal
              );
              document.getElementById("finalTotalDisplay").innerText =
                newTotalText + "đ";
              document.getElementById("hiddenCouponCode").value = code;
            } else {
              msg.innerText = data.message;
              msg.style.color = "red";

              // Reset về giá gốc
              const originalText = new Intl.NumberFormat("vi-VN").format(
                originalTotal
              );
              document.getElementById("finalTotalDisplay").innerText =
                originalText + "đ";
              document.getElementById("hiddenCouponCode").value = "";
            }
          })
          .catch((err) => {
            console.error(err);
            msg.innerText = "Lỗi hệ thống.";
            msg.style.color = "red";
          });
      }

      function openCouponModal() {
        document.getElementById("couponListModal").classList.add("active");
      }

      function selectCoupon(code) {
        document.getElementById("couponInput").value = code;
        document.getElementById("couponListModal").classList.remove("active");
        applyCoupon();
      }

      document
        .querySelectorAll('input[name="paymentMethod"]')
        .forEach((radio) => {
          radio.addEventListener("change", function () {
            document
              .querySelectorAll(".payment-option")
              .forEach((opt) => opt.classList.remove("active"));
            this.parentElement.classList.add("active");
          });
        });

      const confirmBtn = document.querySelector(".confirm-btn");
      if (confirmBtn) {
        confirmBtn.addEventListener("click", function () {
          const form = document.getElementById("checkoutForm");
          if (form && form.checkValidity()) {
            this.innerHTML =
              '<i class="fas fa-spinner fa-spin"></i> Đang xử lý...';
            setTimeout(() => {
              this.disabled = true;
            }, 100);
          }
        });
      }
    </script>
  </body>
</html>
