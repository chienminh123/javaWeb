<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Thông Tin Tài Khoản</title>
    <link th:if="${user.role == 'ADMIN'}" rel="stylesheet" th:href="@{/assets/css/admin.css}" />
    
    <style>
      /* CSS chung */
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f5f7fa;
      }
      
      .container {
        padding: 20px;
        /* Margin-left sẽ được xử lý inline bằng Thymeleaf */
        max-width: 1200px;
      }

      .profile-container {
        display: flex;
        gap: 30px;
        flex-wrap: wrap; /* Cho phép xuống dòng trên màn hình nhỏ */
      }

      .form-section {
        flex: 1; /* Chia đều không gian */
        min-width: 300px;
        background: #fff;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      }

      .form-section h3 {
        margin-top: 0;
        color: #2c3e50;
        border-bottom: 2px solid #eee;
        padding-bottom: 10px;
        margin-bottom: 20px;
      }

      .form-section label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #555;
      }

      .form-section input {
        width: 100%;
        padding: 10px;
        margin-bottom: 20px;
        border: 1px solid #ddd;
        border-radius: 5px;
        box-sizing: border-box; /* Quan trọng để padding không làm vỡ layout */
      }

      .form-section input[readonly] {
        background: #f8f9fa;
        color: #777;
      }

      .submit-btn {
        background: #4caf50;
        color: white;
        padding: 12px 20px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        width: 100%;
        font-size: 16px;
        font-weight: bold;
        transition: background 0.3s;
      }
      .submit-btn:hover {
        background: #45a049;
      }

      .message {
        padding: 15px;
        border-radius: 5px;
        margin-bottom: 20px;
      }
      .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
      .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

      /* CSS Rank Card */
      .rank-card {
        background: white;
        border-radius: 10px;
        padding: 25px;
        margin-bottom: 30px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        position: relative;
        overflow: hidden;
      }
      /* Đường viền màu theo rank */
      .rank-card.rank-member { border-top: 5px solid #6c757d; }
      .rank-card.rank-silver { border-top: 5px solid #bdc3c7; }
      .rank-card.rank-gold { border-top: 5px solid #f1c40f; }
      .rank-card.rank-diamond { border-top: 5px solid #3498db; }

      .rank-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-bottom: 15px;
      }

      .rank-badge {
        font-size: 2rem;
        font-weight: 800;
        text-transform: uppercase;
        margin-top: 5px;
      }
      
      .point-display {
        font-size: 2rem;
        font-weight: 800;
        color: #27ae60;
      }

      .rank-progress {
        background: #f8f9fa;
        padding: 15px;
        border-radius: 8px;
        color: #666;
        display: flex;
        align-items: center;
        gap: 10px;
      }
    </style>
    
    <div th:if="${user.role == 'USER'}">
      <link rel="stylesheet" th:href="@{/user-css/header.css}" />
      <link rel="stylesheet" th:href="@{/user-css/footer.css}" />
    </div>
  </head>
  <body>
    
    <div th:if="${user.role == 'ADMIN'}">
      <div th:replace="~{Admin/header :: Header}"></div>
      <div th:replace="~{Admin/sidebar :: sideBar}"></div>
    </div>
    <div th:if="${user.role == 'USER'}">
      <div th:replace="~{User/userHeader :: user-header}"></div>
    </div>

    <div class="container" 
         th:style="${user.role == 'ADMIN'} ? 'margin-left: 270px;' : 'margin: 0 auto;'">
         
      <h2 style="margin-bottom: 30px; color: #333;">Thông Tin Tài Khoản</h2>

    <div th:if="${user.role == 'USER'}">
            <div class="rank-card" 
                 th:with="currentRank=${user.rank != null ? user.rank : 'MEMBER'}"
                 th:classappend="'rank-' + ${#strings.toLowerCase(currentRank)}">
                 
                <div class="rank-header">
                    <div>
                        <span class="rank-title text-muted">Hạng thành viên</span>
                        <div class="rank-badge" th:text="${currentRank}">MEMBER</div>
                    </div>
                    
                    <div style="text-align: right">
                        <span class="rank-title text-muted">Điểm tích lũy</span>
                        <div>
                            <span class="point-display"
                                  th:text="${user.points != null ? #numbers.formatDecimal(user.points, 0, 'COMMA', 0, 'POINT') : '0'}">
                                0
                            </span>
                            <span style="font-weight: bold;">điểm</span>
                        </div>
                    </div>
                </div>

                <div class="rank-progress">
                    <i class="fa-solid fa-circle-info" style="color: #17a2b8;"></i>
                    
                    <span th:if="${currentRank == 'MEMBER'}">
                       Bạn cần thêm <b th:text="${100000 - (user.points ?: 0)}"></b> điểm để lên hạng <b>SILVER</b>.
                    </span>
                    <span th:if="${currentRank == 'SILVER'}">
                       Bạn cần thêm <b th:text="${500000 - (user.points ?: 0)}"></b> điểm để lên hạng <b>GOLD</b>.
                    </span>
                    <span th:if="${currentRank == 'GOLD'}">
                       Bạn cần thêm <b th:text="${1000000 - (user.points ?: 0)}"></b> điểm để lên hạng <b>DIAMOND</b>.
                    </span>
                    <span th:if="${currentRank == 'DIAMOND'}" style="color: #27ae60; font-weight: bold;">
                       Chúc mừng! Bạn đang ở hạng cao nhất.
                    </span>
                </div>
            </div>
        </div>
      <div class="profile-container" th:object="${user}">
        
        <div class="form-section">
          <h3><i class="fa-solid fa-user-pen"></i> Cập nhật thông tin</h3>
          
          <div th:if="${successMessage}" class="message success" th:text="${successMessage}"></div>
          <div th:if="${errorMessage}" class="message error" th:text="${errorMessage}"></div>

          <form th:action="@{/Auth/updateProfile}" method="post">
            <label>Số điện thoại (Tài khoản):</label>
            <input type="text" th:value="*{phone}" readonly />

            <label>Vai trò:</label>
            <input type="text" th:value="*{role}" readonly />

            <label>Họ và tên hiển thị:</label>
            <input type="text" name="userName" th:value="*{userName}" required placeholder="Nhập tên hiển thị..."/>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" th:value="*{email}" required placeholder="example@email.com"/>

            <label for="address">Địa chỉ giao hàng:</label>
            <input type="text" id="address" name="address" th:value="*{address}" required placeholder="Số nhà, đường, phường/xã..."/>

            <button type="submit" class="submit-btn">Lưu thay đổi</button>
          </form>
        </div>

        <div class="form-section">
          <h3><i class="fa-solid fa-key"></i> Đổi Mật Khẩu</h3>
          
          <div th:if="${passwordSuccess}" class="message success" th:text="${passwordSuccess}"></div>
          <div th:if="${passwordError}" class="message error" th:text="${passwordError}"></div>

          <form th:action="@{/Auth/changePassword}" method="post">
            <label for="oldPassword">Mật khẩu hiện tại:</label>
            <input type="password" id="oldPassword" name="oldPassword" required placeholder="••••••"/>

            <label for="newPassword">Mật khẩu mới:</label>
            <input type="password" id="newPassword" name="newPassword" required placeholder="••••••"/>

            <label for="confirmPassword">Nhập lại mật khẩu mới:</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="••••••"/>

            <button type="submit" class="submit-btn" style="background: #f39c12;">Xác nhận đổi</button>
          </form>
        </div>
      </div>
    </div>

    <div th:if="${user.role == 'ADMIN'}">
      <div th:replace="~{Admin/footer :: Footer}"></div>
    </div>
    <div th:if="${user.role == 'USER'}">
      <div th:replace="~{User/userFooter :: user-footer}"></div>
    </div>
  </body>
</html>
