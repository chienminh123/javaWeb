<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Thông Tin Tài Khoản</title>

    <!-- 1. FONT DÙNG CHUNG (Không gây xung đột) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <!-- 2. CSS RIÊNG CHO USER (Chỉ nạp khi là USER) -->
    <th:block th:if="${user.role == 'USER'}">
      <link rel="stylesheet" th:href="@{/user-css/reset.css}" />
      <link rel="stylesheet" th:href="@{/user-css/main.css}" />
      <link rel="stylesheet" th:href="@{/user-css/header.css}" />
      <link rel="stylesheet" th:href="@{/user-css/footer.css}" />
    </th:block>

    <!-- 3. CSS RIÊNG CHO ADMIN (Chỉ nạp khi là ADMIN) -->
    <th:block th:if="${user.role == 'ADMIN'}">
      <link rel="stylesheet" th:href="@{/assets/css/admin.css}" />
      <!-- Link CSS gốc của Admin nếu có -->
    </th:block>

    <!-- 4. CSS TÙY CHỈNH CHO TRANG PROFILE (Phạm vi hẹp, không phá vỡ layout cũ) -->
    <style>
      /* Thiết lập biến màu */
      :root {
        --p-color: #ff4d4f;
        --bg-gray: #f8f9fa;
        --txt-color: #333;
        --radius: 10px;
      }

      /* Chỉ áp dụng font đẹp cho phần nội dung profile */
      .profile-content-area {
        font-family: "Quicksand", sans-serif;
        color: var(--txt-color);
        background-color: var(--bg-gray);
        min-height: 80vh;
      }

      /* --- LAYOUT ĐỘNG --- */
      /* Nếu là User: Căn giữa */
      .layout-user {
        max-width: 1100px;
        margin: 0 auto;
        padding: 40px 20px;
      }
      /* Nếu là Admin: Có Margin trái để tránh Sidebar */
      .layout-admin {
        margin-left: 225px; /* Độ rộng sidebar admin thường là 225px */
        padding: 30px;
        width: auto;
      }
      /* Responsive cho Admin Mobile */
      @media (max-width: 768px) {
        .layout-admin {
          margin-left: 0;
        }
      }

      .page-heading {
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 30px;
        color: #444;
        border-left: 5px solid var(--p-color);
        padding-left: 15px;
      }

      /* --- RANK CARD (Thẻ thành viên) --- */
      .rank-card {
        background: linear-gradient(135deg, #fff 0%, #fff0f0 100%);
        border-radius: var(--radius);
        padding: 25px;
        margin-bottom: 30px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        border: 1px solid #ffe6e6;
      }
      .rank-badge {
        font-size: 24px;
        font-weight: 800;
        color: var(--p-color);
        text-transform: uppercase;
      }
      .point-display {
        font-size: 32px;
        font-weight: 800;
        color: #333;
      }

      /* --- FORM GRID --- */
      .profile-grid {
        display: grid;
        grid-template-columns: 1.5fr 1fr;
        gap: 30px;
      }
      .card-box {
        background: #fff;
        padding: 30px;
        border-radius: var(--radius);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      }
      .card-header {
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 20px;
        border-bottom: 1px solid #eee;
        padding-bottom: 10px;
      }

      /* Input đẹp */
      .form-group {
        margin-bottom: 15px;
      }
      .form-group label {
        font-weight: 600;
        font-size: 14px;
        display: block;
        margin-bottom: 5px;
      }
      .form-control-custom {
        width: 100%;
        padding: 10px 15px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 14px;
        background: #fff;
        color: #333;
        box-sizing: border-box; /* Quan trọng */
      }
      .form-control-custom:focus {
        border-color: var(--p-color);
        outline: none;
        box-shadow: 0 0 0 3px rgba(255, 77, 79, 0.1);
      }
      .form-control-custom[readonly] {
        background: #f1f3f5;
        cursor: not-allowed;
      }

      .btn-save {
        width: 100%;
        padding: 12px;
        background: var(--p-color);
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 10px;
      }
      .btn-save:hover {
        background: #e04346;
      }

      .btn-warning-custom {
        background: #f39c12;
        color: white;
      }
      .btn-warning-custom:hover {
        background: #e67e22;
      }

      @media (max-width: 900px) {
        .profile-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

  <body>
    <!-- HEADER & SIDEBAR (Điều kiện hiển thị) -->
    <div th:if="${user.role == 'ADMIN'}">
      <div th:replace="~{Admin/sidebar :: sideBar}"></div>
      <div th:replace="~{Admin/header :: Header}"></div>
    </div>
    <div th:if="${user.role == 'USER'}">
      <div th:replace="~{User/userHeader :: user-header}"></div>
    </div>

    <!-- KHU VỰC NỘI DUNG CHÍNH -->
    <!-- Tự động đổi class layout dựa trên Role -->
    <div
      class="profile-content-area"
      th:classappend="${user.role == 'ADMIN'} ? 'layout-admin' : 'layout-user'"
    >
      <h2 class="page-heading">Hồ Sơ Của Tôi</h2>

      <!-- THẺ THÀNH VIÊN (Chỉ hiện cho USER) -->
      <div th:if="${user.role == 'USER'}" class="rank-card">
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: end;
          "
        >
          <div>
            <div
              style="font-size: 13px; color: #888; text-transform: uppercase"
            >
              Hạng thành viên
            </div>
            <div
              class="rank-badge"
              th:text="${user.rank != null ? user.rank : 'MEMBER'}"
            >
              MEMBER
            </div>
          </div>
          <div style="text-align: right">
            <div
              style="font-size: 13px; color: #888; text-transform: uppercase"
            >
              Điểm tích lũy
            </div>
            <div>
              <span
                class="point-display"
                th:text="${user.points != null ? #numbers.formatDecimal(user.points, 0, 'COMMA', 0, 'POINT') : '0'}"
              >
                0
              </span>
              <span style="font-weight: 600; color: #666">điểm</span>
            </div>
          </div>
        </div>
      </div>

      <div class="profile-grid" th:object="${user}">
        <!-- CỘT TRÁI: THÔNG TIN -->
        <div class="card-box">
          <div class="card-header">
            <i class="fa-regular fa-id-card" style="color: #ff4d4f"></i>
            Cập nhật thông tin
          </div>

          <div
            th:if="${successMessage}"
            style="color: green; margin-bottom: 10px"
            th:text="${successMessage}"
          ></div>
          <div
            th:if="${errorMessage}"
            style="color: red; margin-bottom: 10px"
            th:text="${errorMessage}"
          ></div>

          <form th:action="@{/Auth/updateProfile}" method="post">
            <div class="form-group">
              <label>Số điện thoại:</label>
              <input
                type="text"
                class="form-control-custom"
                th:value="*{phone}"
                readonly
              />
            </div>

            <div class="form-group" th:if="${user.role == 'ADMIN'}">
              <label>Vai trò:</label>
              <input
                type="text"
                class="form-control-custom"
                th:value="*{role}"
                readonly
                style="color: blue; font-weight: bold"
              />
            </div>

            <div class="form-group">
              <label>Họ tên hiển thị:</label>
              <input
                type="text"
                class="form-control-custom"
                name="userName"
                th:value="*{userName}"
                required
              />
            </div>

            <div class="form-group">
              <label>Email:</label>
              <input
                type="email"
                class="form-control-custom"
                name="email"
                th:value="*{email}"
                required
              />
            </div>

            <div class="form-group">
              <label>Địa chỉ:</label>
              <input
                type="text"
                class="form-control-custom"
                name="address"
                th:value="*{address}"
                required
              />
            </div>

            <button type="submit" class="btn-save">Lưu thay đổi</button>
          </form>
        </div>

        <!-- CỘT PHẢI: MẬT KHẨU -->
        <div class="card-box">
          <div class="card-header">
            <i class="fa-solid fa-shield-halved" style="color: #f39c12"></i>
            Bảo mật
          </div>

          <div
            th:if="${passwordSuccess}"
            style="color: green; margin-bottom: 10px"
            th:text="${passwordSuccess}"
          ></div>
          <div
            th:if="${passwordError}"
            style="color: red; margin-bottom: 10px"
            th:text="${passwordError}"
          ></div>

          <form th:action="@{/Auth/changePassword}" method="post">
            <div class="form-group">
              <label>Mật khẩu hiện tại:</label>
              <input
                type="password"
                class="form-control-custom"
                name="oldPassword"
                required
                placeholder="••••••"
              />
            </div>

            <div class="form-group">
              <label>Mật khẩu mới:</label>
              <input
                type="password"
                class="form-control-custom"
                name="newPassword"
                required
                placeholder="••••••"
              />
            </div>

            <div class="form-group">
              <label>Nhập lại mật khẩu mới:</label>
              <input
                type="password"
                class="form-control-custom"
                name="confirmPassword"
                required
                placeholder="••••••"
              />
            </div>

            <button type="submit" class="btn-save btn-warning-custom">
              Đổi mật khẩu
            </button>
          </form>
        </div>
      </div>
    </div>

    <!-- FOOTER -->
    <div th:if="${user.role == 'ADMIN'}">
      <div th:replace="~{Admin/footer :: Footer}"></div>
    </div>
    <div th:if="${user.role == 'USER'}">
      <div th:replace="~{User/userFooter :: user-footer}"></div>
    </div>
  </body>
</html>
