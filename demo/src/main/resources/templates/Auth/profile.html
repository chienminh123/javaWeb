<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Thông Tin Tài Khoản</title>
    <link rel="stylesheet" th:href="@{/assets/css/admin.css}" />
    <style>
      .container {
        margin-left: 270px;
        padding: 20px;
      }
      .profile-container {
        display: flex;
        gap: 30px;
      }
      .form-section {
        width: 50%;
        background: #f9f9f9;
        padding: 20px;
        border: 1px solid #ddd;
        border-radius: 5px;
      }
      .form-section h3 {
        margin-top: 0;
      }
      .form-section label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }
      .form-section input {
        width: 95%;
        padding: 8px;
        margin-bottom: 15px;
      }
      .form-section input[readonly] {
        background: #eee;
      }
      .submit-btn {
        background: #4caf50;
        color: white;
        padding: 10px 15px;
        border: none;
        cursor: pointer;
      }
      .message {
        padding: 10px;
        border-radius: 5px;
        margin-bottom: 15px;
      }
      .success {
        background: #e0f8e0;
        color: #3c763d;
      }
      .error {
        background: #f8e0e0;
        color: #a94442;
      }
      /* CSS cho phần hạng thành viên */
      .rank-card {
        background: linear-gradient(to right, #fff8e1, #fff);
        border: 1px solid #ffe082;
        border-left: 5px solid #f39c12;
        padding: 20px;
        border-radius: 8px;
        margin-bottom: 30px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      }
      .rank-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px dashed #ccc;
        padding-bottom: 10px;
        margin-bottom: 10px;
      }
      .rank-title {
        font-size: 16px;
        color: #666;
      }
      .rank-badge {
        font-size: 24px;
        font-weight: bold;
        color: #f39c12;
        text-transform: uppercase;
      }
      .point-display {
        font-size: 28px;
        font-weight: bold;
        color: #27ae60;
      }
      .rank-progress {
        font-size: 14px;
        color: #7f8c8d;
        margin-top: 5px;
      }
    </style>
    <div th:if="${user.role == 'USER'}">
      <link rel="stylesheet" th:href="@{/user-css/header.css}" />
      <link rel="stylesheet" th:href="@{/user-css/footer.css}" />
    </div>
  </head>
  <body>
    <div th:if="${user.role == 'ADMIN'}">
      <div th:replace="Admin/header :: Header"></div>
      <div th:replace="Admin/sidebar :: sideBar"></div>
    </div>
    <div th:if="${user.role == 'USER'}">
      <div th:replace="User/userHeader :: user-header"></div>
    </div>

    <div class="container">
      <h2>Thông Tin Tài Khoản</h2>
      <div th:if="${user.role == 'USER'}">
        <div class="rank-card">
          <div class="rank-header">
            <div>
              <span class="rank-title">Hạng thành viên</span>
              <div class="rank-badge" th:text="${user.rank}">MEMBER</div>
            </div>
            <div style="text-align: right">
              <span class="rank-title">Điểm tích lũy</span>
              <div>
                <span
                  class="point-display"
                  th:text="${#numbers.formatDecimal(user.point, 0, 'COMMA', 0, 'POINT')}"
                  >0</span
                >
                <span>điểm</span>
              </div>
            </div>
          </div>

          <div class="rank-progress">
            <i class="fa-solid fa-circle-info"></i>
            <span th:if="${user.rank == 'MEMBER'}"
              >Tích lũy thêm để đạt hạng <b>SILVER</b> (Cần 100.000 điểm).</span
            >
            <span th:if="${user.rank == 'SILVER'}"
              >Tích lũy thêm để đạt hạng <b>GOLD</b> (Cần 500.000 điểm).</span
            >
            <span th:if="${user.rank == 'GOLD'}"
              >Tích lũy thêm để đạt hạng <b>DIAMOND</b> (Cần 1.000.000
              điểm).</span
            >
            <span th:if="${user.rank == 'DIAMOND'}"
              >Tuyệt vời! Bạn đang ở hạng cao nhất.</span
            >
          </div>
        </div>
      </div>
      <div class="profile-container" th:object="${user}">
        <div class="form-section">
          <h3>Sửa Thông Tin</h3>
          <div
            th:if="${successMessage}"
            class="message success"
            th:text="${successMessage}"
          ></div>
          <div
            th:if="${errorMessage}"
            class="message error"
            th:text="${errorMessage}"
          ></div>

          <form th:action="@{/Auth/updateProfile}" method="post">
            <label>SĐT (Tài khoản):</label>
            <input type="text" th:value="*{phone}" readonly />

            <label>Vai trò (Không thể đổi):</label>
            <input type="text" th:value="*{role}" readonly />

            <label>Họ và tên hiển thị:</label>
            <input
              type="text"
              name="userName"
              th:value="*{userName}"
              required
            />

            <label for="email">Email:</label>
            <input
              type="email"
              id="email"
              name="email"
              th:value="*{email}"
              required
            />

            <label for="address">Địa chỉ:</label>
            <input
              type="text"
              id="address"
              name="address"
              th:value="*{address}"
              required
            />

            <button type="submit" class="submit-btn">Cập nhật thông tin</button>
          </form>
        </div>

        <div class="form-section">
          <h3>Đổi Mật Khẩu</h3>
          <div
            th:if="${passwordSuccess}"
            class="message success"
            th:text="${passwordSuccess}"
          ></div>
          <div
            th:if="${passwordError}"
            class="message error"
            th:text="${passwordError}"
          ></div>

          <form th:action="@{/Auth/changePassword}" method="post">
            <label for="oldPassword">Mật khẩu cũ:</label>
            <input
              type="password"
              id="oldPassword"
              name="oldPassword"
              required
            />

            <label for="newPassword">Mật khẩu mới:</label>
            <input
              type="password"
              id="newPassword"
              name="newPassword"
              required
            />

            <label for="confirmPassword">Xác nhận mật khẩu mới:</label>
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              required
            />

            <button type="submit" class="submit-btn">Đổi mật khẩu</button>
          </form>
        </div>
      </div>
    </div>

    <div th:if="${user.role == 'ADMIN'}">
      <div th:replace="Admin/footer :: Footer"></div>
    </div>

    <div th:if="${user.role == 'USER'}">
      <div th:replace="User/userFooter :: user-footer"></div>
    </div>
  </body>
</html>
