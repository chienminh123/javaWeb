<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Thông Tin Tài Khoản</title>
    <link rel="stylesheet" th:href="@{/assets/css/admin.css}" />
    <style>
      .container {
        margin-left: 270px;
        padding: 20px;
      }
      .profile-container {
        display: flex;
        gap: 30px;
      }
      .form-section {
        width: 50%;
        background: #f9f9f9;
        padding: 20px;
        border: 1px solid #ddd;
        border-radius: 5px;
      }
      .form-section h3 {
        margin-top: 0;
      }
      .form-section label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }
      .form-section input {
        width: 95%;
        padding: 8px;
        margin-bottom: 15px;
      }
      .form-section input[readonly] {
        background: #eee;
      }
      .submit-btn {
        background: #4caf50;
        color: white;
        padding: 10px 15px;
        border: none;
        cursor: pointer;
      }
      .message {
        padding: 10px;
        border-radius: 5px;
        margin-bottom: 15px;
      }
      .success {
        background: #e0f8e0;
        color: #3c763d;
      }
      .error {
        background: #f8e0e0;
        color: #a94442;
      }
    </style>
    <div th:if="${user.role == 'USER'}">
      <link rel="stylesheet" th:href="@{/user-css/header.css}" />
      <link rel="stylesheet" th:href="@{/user-css/footer.css}" />
    </div>
  </head>
  <body>
    <div th:if="${user.role == 'ADMIN'}">
      <div th:replace="Admin/header :: Header"></div>
      <div th:replace="Admin/sidebar :: sideBar"></div>
    </div>
    <div th:if="${user.role == 'USER'}">
      <div th:replace="User/userHeader :: user-header"></div>
    </div>

    <div class="container">
      <h2>Thông Tin Tài Khoản</h2>

      <div class="profile-container" th:object="${user}">
        <div class="form-section">
          <h3>Sửa Thông Tin</h3>
          <div
            th:if="${successMessage}"
            class="message success"
            th:text="${successMessage}"
          ></div>
          <div
            th:if="${errorMessage}"
            class="message error"
            th:text="${errorMessage}"
          ></div>

          <form th:action="@{/Auth/updateProfile}" method="post">
            <label>SĐT (Tài khoản):</label>
            <input type="text" th:value="*{phone}" readonly />

            <label>Vai trò (Không thể đổi):</label>
            <input type="text" th:value="*{role}" readonly />

            <label>Họ và tên hiển thị:</label>
            <input
              type="text"
              name="userName"
              th:value="*{userName}"
              required
            />

            <label for="email">Email:</label>
            <input
              type="email"
              id="email"
              name="email"
              th:value="*{email}"
              required
            />

            <label for="address">Địa chỉ:</label>
            <input
              type="text"
              id="address"
              name="address"
              th:value="*{address}"
              required
            />

            <button type="submit" class="submit-btn">Cập nhật thông tin</button>
          </form>
        </div>

        <div class="form-section">
          <h3>Đổi Mật Khẩu</h3>
          <div
            th:if="${passwordSuccess}"
            class="message success"
            th:text="${passwordSuccess}"
          ></div>
          <div
            th:if="${passwordError}"
            class="message error"
            th:text="${passwordError}"
          ></div>

          <form th:action="@{/Auth/changePassword}" method="post">
            <label for="oldPassword">Mật khẩu cũ:</label>
            <input
              type="password"
              id="oldPassword"
              name="oldPassword"
              required
            />

            <label for="newPassword">Mật khẩu mới:</label>
            <input
              type="password"
              id="newPassword"
              name="newPassword"
              required
            />

            <label for="confirmPassword">Xác nhận mật khẩu mới:</label>
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              required
            />

            <button type="submit" class="submit-btn">Đổi mật khẩu</button>
          </form>
        </div>
      </div>
    </div>

    <div th:if="${user.role == 'ADMIN'}">
      <div th:replace="Admin/footer :: Footer"></div>
    </div>

    <div th:if="${user.role == 'USER'}">
      <div th:replace="User/userFooter :: user-footer"></div>
    </div>
  </body>
</html>
