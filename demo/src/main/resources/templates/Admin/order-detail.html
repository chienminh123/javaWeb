<!DOCTYPE html>
<html
  lang="vi"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
>
  <head>
    <meta charset="UTF-8" />
    <title>Chi tiết Đơn hàng #[[${order.orderId}]]</title>
    <link rel="stylesheet" th:href="@{/admin-css/reset.css}" />
    <link rel="stylesheet" th:href="@{/admin-css/main.css}" />
    <link rel="stylesheet" th:href="@{/admin-css/sidebar.css}" />
    <link rel="stylesheet" th:href="@{/admin-css/header.css}" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <style>
      .detail-container {
        display: flex;
        gap: 30px;
        margin-top: 20px;
      }
      .main-info,
      .items-table-container {
        flex: 2;
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      .sidebar-actions {
        flex: 1;
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        height: fit-content;
      }
      h2 {
        font-size: 20px;
        margin-bottom: 15px;
        border-bottom: 2px solid #eee;
        padding-bottom: 10px;
      }
      .info-box p {
        margin-bottom: 8px;
        font-size: 15px;
      }
      .info-box strong {
        display: inline-block;
        width: 120px;
      }
      .items-table {
        width: 100%;
        border-collapse: collapse;
      }
      .items-table th,
      .items-table td {
        border: 1px solid #ddd;
        padding: 10px;
        text-align: left;
        font-size: 14px;
      }
      .items-table th {
        background-color: #f2f2f2;
      }
      .total-summary {
        text-align: right;
        font-size: 18px;
        font-weight: bold;
        margin-top: 20px;
        padding-top: 10px;
        border-top: 1px solid #eee;
      }
      /* Status update form */
      .status-update select {
        width: 100%;
        padding: 8px;
        margin-bottom: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      .status-update button {
        width: 100%;
        padding: 10px;
        background-color: #008cba;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
      }
      .status-badge {
        /* CSS cho status badge giống như orders.html */
        display: inline-block;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: bold;
        color: white; /* Đảm bảo chữ màu trắng */
      }

      /* === QUY TẮC MỚI THEO YÊU CẦU CỦA BẠN === */

      /* MÀU ĐỎ: Hủy */
      .status-Đã_hủy {
        background-color: #ff4d4f; /* Đỏ */
      }

      /* MÀU VÀNG: Chờ thanh toán, Đang xử lý */
      .status-Chờ_thanh_toán,
      .status-Đang_xử_lý {
        background-color: #faad14; /* Vàng cam */
      }

      /* MÀU XANH LÁ/DƯƠNG: Các trạng thái còn lại (Đang chuẩn bị, Đã xác nhận, Đang giao hàng, Đã hoàn thành) */
      .status-Đã_hoàn_thành,
      .status-Đang_chuẩn_bị,
      .status-Đã_xác_nhận,
      .status-Đang_giao_hàng {
        background-color: #52c41a; /* Xanh lá */
      }
      .alert-success {
        color: #155724;
        background-color: #d4edda;
        border-color: #c3e6cb;
        padding: 10px;
        margin-bottom: 15px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div th:replace="Admin/header::Header"></div>
    <div th:replace="Admin/sidebar::sideBar"></div>
    <div id="content-right">
      <div class="home">
        <h1>
          <i class="fas fa-receipt"></i> Chi tiết Đơn hàng #[[${order.orderId}]]
        </h1>

        <div th:if="${successMessage}" class="alert-success">
          <p th:text="${successMessage}"></p>
        </div>

        <div class="detail-container">
          <div class="main-info">
            <h2>Thông tin Khách hàng & Vận chuyển</h2>
            <div class="info-box">
              <p>
                <strong>Khách hàng:</strong>
                <span th:text="${order.user.userName}"></span>
                (ID: <span th:text="${order.user.userId}"></span>)
              </p>
              <p>
                <strong>SĐT Nhận hàng:</strong>
                <span th:text="${order.phone}"></span>
              </p>
              <p>
                <strong>Địa chỉ:</strong>
                <span th:text="${order.address}"></span>
              </p>
              <p>
                <strong>Ngày đặt:</strong>
                <span
                  th:text="${#temporals.format(order.orderDate, 'dd/MM/yyyy HH:mm')}"
                ></span>
              </p>
              <p>
                <strong>PT Thanh toán:</strong>
                <span th:text="${order.paymentMethod}"></span>
              </p>
            </div>

            <h2>Sản phẩm đã đặt</h2>
            <div class="items-table-container">
              <table class="items-table">
                <thead>
                  <tr>
                    <th>Sản phẩm</th>
                    <th>Size</th>
                    <th>Giá bán</th>
                    <th>Số lượng</th>
                    <th>Thành tiền</th>
                  </tr>
                </thead>
                <tbody>
                  <tr th:each="detail : ${order.orderDetails}">
                    <td th:text="${detail.product.productName}">Áo Phông</td>
                    <td th:text="${detail.sizes.sizeName}">L</td>
                    <td>
                      <span
                        th:text="${#numbers.formatDecimal(detail.price, 0, 'COMMA', 0, 'POINT')} + ' đ'"
                      ></span>
                    </td>
                    <td th:text="${detail.quantity}">2</td>
                    <td>
                      <span
                        th:text="${#numbers.formatDecimal(detail.price * detail.quantity, 0, 'COMMA', 0, 'POINT')} + ' đ'"
                      ></span>
                    </td>
                  </tr>
                </tbody>
              </table>
              <div class="total-summary">
                Tổng cộng:
                <span
                  th:with="total=${#aggregates.sum(order.orderDetails.![price * quantity])}"
                  th:text="${#numbers.formatDecimal(total, 0, 'COMMA', 0, 'POINT')} + ' đ'"
                ></span>
              </div>
            </div>
          </div>

          <div class="sidebar-actions">
            <h2>Trạng thái Đơn hàng</h2>
            <div class="status-box">
              <p style="margin-bottom: 15px">
                Trạng thái hiện tại:
                <span
                  class="status-badge"
                  th:classappend="'status-' + ${#strings.replace(order.status, ' ', '_')}"
                  th:text="${order.status}"
                ></span>
              </p>

              <form
                th:action="@{/Admin/updateOrderStatus}"
                method="POST"
                class="status-update"
              >
                <input
                  type="hidden"
                  th:name="${_csrf.parameterName}"
                  th:value="${_csrf.token}"
                />
                <input
                  type="hidden"
                  name="orderId"
                  th:value="${order.orderId}"
                />

                <label for="newStatus">Cập nhật trạng thái:</label>
                <select id="newStatus" name="newStatus" required>
                  <option
                    th:each="status : ${statusList}"
                    th:value="${status}"
                    th:text="${status}"
                    th:selected="${status == order.status}"
                  >
                    Trạng thái
                  </option>
                </select>

                <button type="submit">Cập nhật Trạng thái</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div th:replace="Admin/footer::Footer"></div>
  </body>
</html>
