<!DOCTYPE html>
<html
  lang="vi"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản trị</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA== "
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" th:href="@{/assets/css/admin.css}" />
  </head>
  <body>
    <div class="admin-layout">
      <div th:replace="Admin/sidebar::sideBar"></div>

      <div class="admin-content-wrapper">
        <div th:replace="Admin/header::Header"></div>

        <main class="admin-main">
          <div class="dashboard-content">
            <div class="banner">
              <img th:src="@{/img/banner-admin.jpg}" alt="Banner" />
            </div>

            <h3 class="section-title">📊 Tổng quan</h3>
            <div class="cards-grid">
              <article class="card metric">
                <div class="label">Tổng giá trị tồn kho (Giá gốc * SL tồn)</div>
                <div
                  class="value"
                  th:text="${#numbers.formatDecimal(totalInventoryValue, 0, 'COMMA', 0, 'POINT')} + ' đ'"
                ></div>
              </article>

              <article class="card metric">
                <div class="label">Hết hàng</div>
                <div class="value danger" th:text="${outOfStockCount} + ' HH'">
                  0 HH
                </div>
                <div class="card-actions">
                  <a th:href="@{/Admin/tonkho(filter='out_of_stock')}"
                    >Chi tiết</a
                  >
                </div>
              </article>
            </div>

            <h3 class="section-title">🚨 Cần theo dõi</h3>

            <div class="cards-grid monitor-cards">
              <article class="card order-card">
                <img th:src="@{/img/delivery-time.png}" alt="Đã hủy" />
                <div class="card-details">
                  <div class="label">Đơn hàng đã hủy</div>
                  <div class="value" th:text="${cancelledOrdersCount} + ' ĐH'">
                    0 ĐH
                  </div>
                  <div class="card-actions">
                    <a th:href="@{/Admin/orders(status='Đã hủy')}">Chi tiết</a>
                  </div>
                </div>
              </article>

              <article class="card order-card">
                <img th:src="@{/img/shipping.png}" alt="Chờ xác nhận" />
                <div class="card-details">
                  <div class="label">Đơn hàng chờ xác nhận</div>
                  <div class="value" th:text="${pendingOrdersCount} + ' ĐH'">
                    0 ĐH
                  </div>
                  <div class="card-actions">
                    <a th:href="@{/Admin/orders(status='Cho_Xu_Ly')}"
                      >Xem tất cả</a
                    >
                  </div>
                </div>
              </article>
            </div>
            <div
              style="
                margin-top: 30px;
                margin-bottom: 20px;
                text-align: center;
                border-top: 1px solid #ddd;
                padding-top: 20px;
              "
            >
              <a
                th:href="@{/Admin/orders}"
                style="
                  padding: 15px 30px;
                  background-color: #007bff;
                  color: white;
                  text-decoration: none;
                  border-radius: 8px;
                  font-weight: bold;
                  font-size: 16px;
                  display: inline-block;
                "
              >
                <i class="fas fa-list-alt"></i> Xem tất cả Đơn hàng
              </a>
            </div>
          </div>
        </main>

        <div th:replace="Admin/footer::Footer"></div>
      </div>
    </div>
  </body>
</html>
