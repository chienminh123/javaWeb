<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết Khách hàng</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h3>Cập nhật thông tin khách hàng</h3>
    
    <form th:action="@{/Admin/updateUser}" th:object="${user}" method="post" class="mt-4">
        <input type="hidden" th:field="*{userId}" />
        
        <div class="mb-3">
            <label>Họ tên:</label>
            <input type="text" th:field="*{userName}" class="form-control" required />
        </div>
        
        <div class="mb-3">
            <label>Số điện thoại:</label>
            <input type="text" th:field="*{phone}" class="form-control" />
        </div>

        <div class="mb-3">
            <label>Email:</label>
            <input type="email" th:field="*{email}" class="form-control" />
        </div>

        <div class="mb-3">
            <label>Địa chỉ:</label>
            <input type="text" th:field="*{address}" class="form-control" />
        </div>
        
        <div class="mb-3">
            <label>Điểm tích lũy (Chỉ xem):</label>
            <input type="text" th:field="*{points}" class="form-control" readonly style="background-color: #e9ecef;" />
        </div>

        <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
        <a th:href="@{/Admin/customers}" class="btn btn-secondary">Quay lại</a>
    </form>
</div>
</body>
</html>
