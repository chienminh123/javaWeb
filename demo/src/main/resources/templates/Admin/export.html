<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Xuất Kho Sản Phẩm</title>
    <link rel="stylesheet" th:href="@{/Admin.css}" />
    <!-- CSRF -->
    <meta name="csrf-token" th:content="${_csrf.token}" />
    <meta name="csrf-header" th:content="${_csrf.headerName}" />
    <style>
      .error-message {
        color: red;
        background: #ffe0e0;
        padding: 10px;
        margin: 15px 0;
        border: 1px solid red;
        border-radius: 4px;
      }
      .autocomplete-items {
        position: absolute;
        border: 1px solid #d4d4d4;
        border-top: none;
        z-index: 99;
        max-height: 150px;
        overflow-y: auto;
        background: white;
      }
      .autocomplete-items div {
        padding: 10px;
        cursor: pointer;
        border-bottom: 1px solid #d4d4d4;
      }
      .autocomplete-items div:hover {
        background-color: #e9e9e9;
      }
      .size-row {
        display: flex;
        gap: 5px;
        align-items: center;
        margin-bottom: 5px;
      }
      .remove-size {
        background: #ff4444;
        color: white;
        border: none;
        width: 20px;
        height: 20px;
        font-size: 12px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div th:replace="Admin/header :: Header"></div>
    <div th:replace="Admin/sidebar :: sideBar"></div>

    <div class="container" th:fragment="exportContent">
      <h3>Tạo Phiếu Xuất Kho</h3>

      <div
        th:if="${errorMessage}"
        class="error-message"
        th:text="${errorMessage}"
      ></div>

      <button type="button" class="add-product-btn" onclick="addProductRow()">
        + Thêm sản phẩm
      </button>

      <form
        id="multiExportForm"
        th:action="@{/Admin/processExport}"
        method="post"
      >
        <table id="productTable">
          <thead>
            <tr>
              <th>NCC (Bắt buộc)</th>
              <th>Tên sản phẩm (Chọn từ gợi ý)</th>
              <th>Size & SL Xuất</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <!-- Template row - ẩn -->
            <tr class="product-row" style="display: none">
              <td>
                <select
                  name="providerId"
                  required
                  onchange="loadProductSuggestions(this)"
                >
                  <option value="">-- Chọn NCC --</option>
                  <option
                    th:each="p : ${providers}"
                    th:value="${p.providerId}"
                    th:text="${p.providerName}"
                  ></option>
                </select>
              </td>
              <td class="autocomplete" style="position: relative">
                <input
                  type="text"
                  name="productName"
                  placeholder="Nhập tên SP..."
                  required
                  oninput="showSuggestions(this)"
                  autocomplete="off"
                />
                <div class="autocomplete-items"></div>
                <input type="hidden" name="productId" required />
              </td>
              <td>
                <div class="sizes-container">
                  <div class="size-row">
                    <input
                      type="text"
                      name="sizeName"
                      placeholder="S"
                      style="width: 40px"
                    />
                    <input
                      type="number"
                      name="quantity"
                      placeholder="SL"
                      min="1"
                      style="width: 50px"
                    />
                    <button
                      type="button"
                      class="add-btn"
                      onclick="addSizeRow(this)"
                    >
                      +
                    </button>
                  </div>
                </div>
              </td>
              <td>
                <button
                  type="button"
                  class="remove-row"
                  onclick="removeRow(this)"
                >
                  X
                </button>
              </td>
            </tr>
          </tbody>
        </table>

        <button type="button" class="submit-all" onclick="submitForm()">
          XÁC NHẬN XUẤT KHO
        </button>
      </form>
    </div>

    <div th:replace="Admin/footer :: Footer"></div>

    <script th:inline="javascript">
      const productSuggestions = /*[[${productSuggestions}]]*/ {};

      // CSRF
      function getCsrf() {
        const token = document.querySelector('meta[name="csrf-token"]').content;
        const header = document.querySelector(
          'meta[name="csrf-header"]'
        ).content;
        return { token, header };
      }

      function addProductRow() {
        const tbody = document.querySelector("#productTable tbody");
        const template = tbody.querySelector(".product-row").cloneNode(true);
        template.style.display = "table-row";

        // Reset inputs
        template.querySelectorAll("input, select").forEach((el) => {
          if (
            el.type === "text" ||
            el.type === "number" ||
            el.type === "hidden"
          )
            el.value = "";
          if (el.tagName === "SELECT") el.selectedIndex = 0;
        });

        // Reset sizes container
        const container = template.querySelector(".sizes-container");
        container.innerHTML = `
        <div class="size-row">
          <input type="text" name="sizeName" placeholder="S" style="width:40px" />
          <input type="number" name="quantity" placeholder="SL" min="1" style="width:50px" />
          <button type="button" class="add-btn" onclick="addSizeRow(this)">+</button>
        </div>
      `;

        tbody.appendChild(template);
      }

      function addSizeRow(btn) {
        const container = btn.closest(".sizes-container");
        const newRow = document.createElement("div");
        newRow.className = "size-row";
        newRow.innerHTML = `
        <input type="text" name="sizeName" placeholder="M" style="width:40px" />
        <input type="number" name="quantity" placeholder="SL" min="1" style="width:50px" />
        <button type="button" class="remove-size" onclick="this.parentElement.remove()">−</button>
      `;
        container.appendChild(newRow);
      }

      function removeRow(btn) {
        const row = btn.closest("tr");
        if (
          document.querySelectorAll(
            "#productTable tbody tr:not([style*='display: none'])"
          ).length <= 1
        ) {
          alert("Phải có ít nhất 1 sản phẩm!");
          return;
        }
        row.remove();
      }

      function loadProductSuggestions(select) {
        const providerId = select.value;
        const suggestions = productSuggestions[providerId] || [];
        const input = select
          .closest("tr")
          .querySelector('input[name="productName"]');
        input.dataset.suggestions = JSON.stringify(suggestions);
      }

      function showSuggestions(input) {
        const suggestions = JSON.parse(input.dataset.suggestions || "[]");
        const val = input.value.trim().toLowerCase();
        const container = input.nextElementSibling;
        container.innerHTML = "";

        if (!val) return;

        const filtered = suggestions
          .filter((p) => p.productName.toLowerCase().includes(val))
          .slice(0, 5);

        filtered.forEach((p) => {
          const div = document.createElement("div");
          div.innerHTML = `<strong>${p.productName}</strong><br>
                         <small>Mã: ${p.productId} | Tồn: ${
            p.totalQuantity || 0
          }</small>`;
          div.onclick = () => {
            input.value = p.productName;
            input.closest("td").querySelector('input[name="productId"]').value =
              p.productId;
            container.innerHTML = "";
          };
          container.appendChild(div);
        });
      }

      function submitForm() {
        const form = document.getElementById("multiExportForm");
        let valid = true;
        let firstError = null;

        document
          .querySelectorAll(
            "#productTable tbody tr:not([style*='display: none'])"
          )
          .forEach((row) => {
            const providerId = row.querySelector(
              'select[name="providerId"]'
            ).value;
            const productId = row.querySelector(
              'input[name="productId"]'
            ).value;
            const sizeRows = row.querySelectorAll(".size-row");

            if (!providerId || !productId) {
              valid = false;
              if (!firstError)
                firstError = "Vui lòng chọn NCC và sản phẩm hợp lệ!";
              return;
            }

            let hasValidSize = false;
            sizeRows.forEach((sizeRow) => {
              const sizeName = sizeRow
                .querySelector('input[name="sizeName"]')
                .value.trim();
              const qty = sizeRow.querySelector('input[name="quantity"]').value;
              if (sizeName && qty && parseInt(qty) > 0) {
                hasValidSize = true;
              }
            });

            if (!hasValidSize) {
              valid = false;
              if (!firstError)
                firstError =
                  "Sản phẩm '" +
                  row.querySelector('input[name="productName"]').value +
                  "' cần ít nhất 1 size có số lượng > 0!";
            }
          });

        if (!valid) {
          alert(firstError);
          return;
        }

        // Thêm CSRF token vào form
        const { token, header } = getCsrf();
        const input = document.createElement("input");
        input.type = "hidden";
        input.name = "_csrf";
        input.value = token;
        form.appendChild(input);

        form.submit();
      }

      // Tự động thêm 1 dòng khi load
      window.onload = () => {
        addProductRow();
      };
    </script>
  </body>
</html>
