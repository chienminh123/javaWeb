<div th:fragment="Header">
  <header class="admin-header">
    <div class="header-left">
      <button id="sidebar-toggle" class="toggle-btn" title="Ẩn/hiện menu">
        ☰
      </button>
      <span class="header-title">Bảng Quản Trị</span>
    </div>

    <div class="header-right">
      <i class="fa-solid fa-bell icon"></i>
      <i class="fa-solid fa-user-tie icon" onclick="toggleProfileMenu()"></i>

      <div id="profileMenu" class="profile-dropdown">
        <div th:if="${currentUserPhone}">
          <div class="profile-info">
            Đăng nhập bằng:<br />
            <strong th:text="${currentUserPhone}"></strong>
          </div>
          <a th:href="@{/Auth/profile}">Thông tin tài khoản</a>
          <form th:action="@{/logout}" method="post" style="margin: 0">
            <button type="submit" class="logout-btn">Đăng xuất</button>
          </form>
        </div>
        <div th:unless="${currentUserPhone}">
          <a th:href="@{/login}">Đăng nhập</a>
        </div>
      </div>
    </div>
  </header>

  <script>
    const toggleBtn = document.getElementById("sidebar-toggle");
    // Lấy admin-layout hoặc body để toggle class
    const body = document.body;

    toggleBtn.addEventListener("click", () => {
      // Chỉ cần toggle class 'sidebar-hidden' trên body
      body.classList.toggle("sidebar-hidden");
    });

    function toggleProfileMenu() {
      document.getElementById("profileMenu").classList.toggle("show");
    }

    window.onclick = function (e) {
      if (!e.target.matches(".icon")) {
        const menu = document.getElementById("profileMenu");
        if (menu && menu.classList.contains("show"))
          menu.classList.remove("show");
      }
    };
  </script>
</div>
