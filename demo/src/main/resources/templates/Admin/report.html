<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Báo Cáo</title>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>

        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
            integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA== "
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
        <link rel="stylesheet" th:href="@{/assets/css/admin.css}" />
    </head>
    <body class="admin-layout">
        <div th:replace="Admin/sidebar :: sideBar"></div>
        <div class="admin-content-wrapper">
            <div th:replace="Admin/header :: Header"></div>

            <main class="admin-main">
                <div class="report-container">
                    <div class="report-header">
                        <h2 class="page-title">
                            <i class="fa-solid fa-chart-line"></i> Báo Cáo
                        </h2>

                        <form
                            th:action="@{/Admin/report}"
                            method="GET"
                            class="date-filter-group"
                        >
                            <label for="startDate">Từ ngày:</label>
                            <input
                                type="date"
                                id="startDate"
                                name="startDate"
                                th:value="${startDate}"
                                class="form-input"
                            />

                            <label for="endDate">Đến ngày:</label>
                            <input
                                type="date"
                                id="endDate"
                                name="endDate"
                                th:value="${endDate}"
                                class="form-input"
                            />

                            <button type="submit" class="btn btn-primary">
                                <i class="fa-solid fa-eye"></i> Xem Báo Cáo
                            </button>
                        </form>
                    </div>

                    <h3 class="section-title">Biểu đồ Doanh thu (Theo Ngày)</h3>
                    <div class="chart-wrapper">
                        <div class="chart-container">
                            <canvas id="revenueChart"></canvas>
                        </div>
                    </div>

                    <div class="split-container">
                        <div class="top-products card">
                            <h3 class="card-title">
                                <i class="fa-solid fa-star"></i> Top 10 Sản phẩm
                                Bán chạy
                            </h3>
                            <div class="table-wrapper">
                                <table class="data-table small-table">
                                    <thead>
                                        <tr>
                                            <th style="width: 5%">STT</th>
                                            <th style="width: 45%">Sản phẩm</th>
                                            <th style="width: 25%">Hình ảnh</th>
                                            <th style="width: 25%">
                                                Tổng SL đã bán
                                            </th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr
                                            th:each="item, iter : ${topProducts}"
                                        >
                                            <td
                                                th:text="${iter.index + 1}"
                                                class="text-center"
                                            ></td>
                                            <td
                                                th:text="${item.product?.productName ?: 'Sản phẩm đã bị xóa'}"
                                            ></td>
                                            <td class="text-center">
                                                <img
                                                    th:if="${item.product?.imageUrl}"
                                                    th:src="@{${item.product.imageUrl}}"
                                                    class="product-image-small"
                                                    alt="Ảnh SP"
                                                />
                                            </td>
                                            <td
                                                th:text="${item.totalQuantity}"
                                                class="text-center"
                                            ></td>
                                        </tr>
                                        <tr
                                            th:if="${#lists.isEmpty(topProducts)}"
                                        >
                                            <td colspan="4" class="no-data">
                                                Không có dữ liệu.
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div class="quittances card">
                            <h3 class="card-title">
                                <i class="fa-solid fa-receipt"></i> Biên Lai Kho
                            </h3>

                            <h4 class="sub-section-title">NHẬP KHO</h4>
                            <div class="table-wrapper small-table-wrapper">
                                <table class="data-table small-table">
                                    <thead>
                                        <tr>
                                            <th style="width: 20%">Mã BL</th>
                                            <th style="width: 50%">Tên</th>
                                            <th style="width: 30%">Ngày</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="q : ${importQuittances}">
                                            <td class="text-center">
                                                <a
                                                    th:href="@{/Admin/quittance/{id}(id=${q.quittanceId})}"
                                                    th:text="${q.quittanceId}"
                                                ></a>
                                            </td>
                                            <td
                                                th:text="${q.quittanceName}"
                                            ></td>
                                            <td
                                                th:text="${#temporals.format(q.date, 'dd/MM/yyyy HH:mm')}"
                                            ></td>
                                        </tr>
                                        <tr
                                            th:if="${#lists.isEmpty(importQuittances)}"
                                        >
                                            <td colspan="3" class="no-data">
                                                Không có dữ liệu.
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>

                            <h4 class="sub-section-title">XUẤT KHO</h4>
                            <div class="table-wrapper small-table-wrapper">
                                <table class="data-table small-table">
                                    <thead>
                                        <tr>
                                            <th style="width: 20%">Mã BL</th>
                                            <th style="width: 50%">Tên</th>
                                            <th style="width: 30%">Ngày</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="q : ${exportQuittances}">
                                            <td class="text-center">
                                                <a
                                                    th:href="@{/Admin/quittance/{id}(id=${q.quittanceId})}"
                                                    th:text="${q.quittanceId}"
                                                ></a>
                                            </td>
                                            <td
                                                th:text="${q.quittanceName}"
                                            ></td>
                                            <td
                                                th:text="${#temporals.format(q.date, 'dd/MM/yyyy HH:mm')}"
                                            ></td>
                                        </tr>
                                        <tr
                                            th:if="${#lists.isEmpty(exportQuittances)}"
                                        >
                                            <td colspan="3" class="no-data">
                                                Không có dữ liệu.
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </main>

            <div th:replace="Admin/footer :: Footer"></div>
        </div>

        <script th:inline="javascript">
            // ... GIỮ NGUYÊN TOÀN BỘ JAVASCRIPT LOGIC CHO CHART.JS ...
            /* Lấy dữ liệu doanh thu từ Model */
            const revenueData = /*[[${revenueData}]]*/ [];

            // Chuyển đổi dữ liệu sang định dạng Chart.js
            const labels = revenueData.map((item) => item.date);
            const data = revenueData.map((item) => item.revenue);

            const ctx = document
                .getElementById("revenueChart")
                .getContext("2d");
            new Chart(ctx, {
                type: "line", // Loại biểu đồ (line, bar, pie...)
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: "Doanh thu (VND)",
                            data: data,
                            borderColor: "rgb(75, 192, 192)",
                            backgroundColor: "rgba(75, 192, 192, 0.2)",
                            tension: 0.1,
                            fill: true,
                        },
                    ],
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            type: "time",
                            time: {
                                unit: "day",
                                tooltipFormat: "dd/MM/yyyy",
                            },
                            title: {
                                display: true,
                                text: "Ngày",
                            },
                        },
                        y: {
                            title: {
                                display: true,
                                text: "Doanh thu (VND)",
                            },
                            ticks: {
                                // Format tiền tệ
                                callback: function (value, index, values) {
                                    return (
                                        new Intl.NumberFormat("vi-VN").format(
                                            value
                                        ) + " đ"
                                    );
                                },
                            },
                        },
                    },
                },
            });
        </script>
    </body>
</html>
