<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Báo Cáo</title>
    <link rel="stylesheet" th:href="@{/css/Admin.css}" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>

    <style>
      .container {
        margin-left: 270px;
        padding: 20px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 8px;
        text-align: left;
      }
      th {
        background-color: #f2f2f2;
      }
      .report-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .date-filter {
        background: #f9f9f9;
        padding: 15px;
        border: 1px solid #ddd;
        border-radius: 5px;
      }
      .chart-container {
        width: 100%;
        height: 400px;
        margin-top: 20px;
      }
      .split-container {
        display: flex;
        gap: 20px;
        margin-top: 30px;
      }
      .split-container > div {
        width: 50%;
      }
      .product-image-small {
        width: 40px;
        height: 40px;
        object-fit: cover;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div th:replace="Admin/header :: Header"></div>
    <div th:replace="Admin/sidebar :: sideBar"></div>

    <div class="container">
      <div class="report-header">
        <h2>Báo Cáo</h2>

        <form th:action="@{/Admin/report}" method="GET" class="date-filter">
          <label for="startDate">Từ ngày:</label>
          <input
            type="date"
            id="startDate"
            name="startDate"
            th:value="${startDate}"
          />

          <label for="endDate">Đến ngày:</label>
          <input
            type="date"
            id="endDate"
            name="endDate"
            th:value="${endDate}"
          />

          <button type="submit" style="padding: 8px 12px">Xem Báo Cáo</button>
        </form>
      </div>

      <h3>Biểu đồ Doanh thu (Theo Ngày)</h3>
      <div class="chart-container">
        <canvas id="revenueChart"></canvas>
      </div>

      <div class="split-container">
        <div class="top-products">
          <h3>Top 10 Sản phẩm Bán chạy</h3>
          <table>
            <thead>
              <tr>
                <th>STT</th>
                <th>Sản phẩm</th>
                <th>Hình ảnh</th>
                <th>Tổng số lượng đã bán</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="item, iter : ${topProducts}">
                <td th:text="${iter.index + 1}"></td>
                <td
                  th:text="${item.product?.productName ?: 'Sản phẩm đã bị xóa'}"
                ></td>
                <td>
                  <img
                    th:if="${item.product?.imageUrl}"
                    th:src="@{${item.product.imageUrl}}"
                    class="product-image-small"
                    alt="Ảnh SP"
                  />
                </td>
                <td th:text="${item.totalQuantity}"></td>
              </tr>
              <tr th:if="${#lists.isEmpty(topProducts)}">
                <td colspan="4" style="text-align: center">
                  Không có dữ liệu.
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="quittances">
          <h3>Biên Lai Kho</h3>

          <h4>Biên lai NHẬP KHO</h4>
          <table>
            <thead>
              <tr>
                <th>Mã Biên Lai</th>
                <th>Tên</th>
                <th>Ngày</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="q : ${importQuittances}">
                <td>
                  <a
                    th:href="@{/Admin/quittance/{id}(id=${q.quittanceId})}"
                    th:text="${q.quittanceId}"
                  ></a>
                </td>
                <td th:text="${q.quittanceName}"></td>
                <td
                  th:text="${#temporals.format(q.date, 'dd/MM/yyyy HH:mm')}"
                ></td>
              </tr>
              <tr th:if="${#lists.isEmpty(importQuittances)}">
                <td colspan="3" style="text-align: center">
                  Không có dữ liệu.
                </td>
              </tr>
            </tbody>
          </table>

          <h4 style="margin-top: 15px">Biên lai XUẤT KHO</h4>
          <table>
            <thead>
              <tr>
                <th>Mã Biên Lai</th>
                <th>Tên</th>
                <th>Ngày</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="q : ${exportQuittances}">
                <td>
                  <a
                    th:href="@{/Admin/quittance/{id}(id=${q.quittanceId})}"
                    th:text="${q.quittanceId}"
                  ></a>
                </td>
                <td th:text="${q.quittanceName}"></td>
                <td
                  th:text="${#temporals.format(q.date, 'dd/MM/yyyy HH:mm')}"
                ></td>
              </tr>
              <tr th:if="${#lists.isEmpty(exportQuittances)}">
                <td colspan="3" style="text-align: center">
                  Không có dữ liệu.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div th:replace="Admin/footer :: Footer"></div>

    <script th:inline="javascript">
      /* Lấy dữ liệu doanh thu từ Model */
      const revenueData = /*[[${revenueData}]]*/ [];

      // Chuyển đổi dữ liệu sang định dạng Chart.js
      const labels = revenueData.map((item) => item.date);
      const data = revenueData.map((item) => item.revenue);

      const ctx = document.getElementById("revenueChart").getContext("2d");
      new Chart(ctx, {
        type: "line", // Loại biểu đồ (line, bar, pie...)
        data: {
          labels: labels,
          datasets: [
            {
              label: "Doanh thu (VND)",
              data: data,
              borderColor: "rgb(75, 192, 192)",
              backgroundColor: "rgba(75, 192, 192, 0.2)",
              tension: 0.1,
              fill: true,
            },
          ],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: {
              type: "time",
              time: {
                unit: "day",
                tooltipFormat: "dd/MM/yyyy",
              },
              title: {
                display: true,
                text: "Ngày",
              },
            },
            y: {
              title: {
                display: true,
                text: "Doanh thu (VND)",
              },
              ticks: {
                // Format tiền tệ
                callback: function (value, index, values) {
                  return new Intl.NumberFormat("vi-VN").format(value) + " đ";
                },
              },
            },
          },
        },
      });
    </script>
  </body>
</html>
