<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <title>Thêm Nhiều Sản Phẩm</title>
        <link rel="stylesheet" th:href="@{/assets/css/admin.css}" />
        <meta name="csrf-token" th:content="${_csrf.token}" />
        <meta name="csrf-header" th:content="${_csrf.headerName}" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
            integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA== "
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
    </head>
    <body class="admin-layout">
        <div th:replace="Admin/sidebar :: sideBar"></div>
        <div class="admin-content-wrapper">
            <div th:replace="Admin/header :: Header"></div>

            <main class="admin-main">
                <div
                    class="product-form-container"
                    th:fragment="addProductContent"
                >
                    <h2 class="page-title">
                        <i class="fa-solid fa-boxes-packing"></i> Nhập Kho Sản
                        Phẩm
                    </h2>

                    <div class="form-actions">
                        <button
                            type="button"
                            class="btn btn-primary"
                            onclick="addProductRow()"
                        >
                            <i class="fa-solid fa-plus"></i> Thêm sản phẩm
                        </button>
                    </div>

                    <form
                        id="multiProductForm"
                        th:action="@{/Admin/saveMultipleProducts}"
                        method="post"
                        enctype="multipart/form-data"
                    >
                        <div class="table-wrapper">
                            <table
                                id="productTable"
                                class="data-table large-form-table"
                            >
                                <thead>
                                    <tr>
                                        <th style="width: 10%">
                                            NCC
                                            <button
                                                type="button"
                                                class="btn btn-icon btn-add-small"
                                                onclick="openProviderModal()"
                                            >
                                                <i class="fa-solid fa-plus"></i>
                                            </button>
                                        </th>
                                        <th style="width: 20%">Tên sản phẩm</th>
                                        <th style="width: 10%">
                                            Thể loại
                                            <button
                                                type="button"
                                                class="btn btn-icon btn-add-small"
                                                onclick="openGenreModal()"
                                            >
                                                <i class="fa-solid fa-plus"></i>
                                            </button>
                                        </th>
                                        <th style="width: 8%">Giá gốc</th>
                                        <th style="width: 17%">Size & SL</th>
                                        <th style="width: 15%">Mô tả</th>
                                        <th style="width: 15%">Hình ảnh</th>
                                        <th style="width: 5%"></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr
                                        class="product-row"
                                        style="display: none"
                                    >
                                        <td>
                                            <select
                                                name="providerId"
                                                required
                                                class="form-select"
                                                onchange="loadProductSuggestions(this)"
                                            >
                                                <option value="">
                                                    -- Chọn NCC --
                                                </option>
                                                <option
                                                    th:each="p : ${providers}"
                                                    th:value="${p.providerId}"
                                                    th:text="${p.providerName}"
                                                ></option>
                                            </select>
                                        </td>
                                        <td class="autocomplete">
                                            <input
                                                type="text"
                                                name="productName"
                                                placeholder="Nhập tên..."
                                                required
                                                oninput="showSuggestions(this)"
                                                class="form-input"
                                            />
                                            <div
                                                class="autocomplete-items"
                                            ></div>
                                        </td>
                                        <td>
                                            <select
                                                name="genreId"
                                                required
                                                class="form-select"
                                            >
                                                <option value="">
                                                    -- Chọn thể loại --
                                                </option>
                                                <option
                                                    th:each="g : ${genres}"
                                                    th:value="${g.genreId}"
                                                    th:text="${g.genreName}"
                                                ></option>
                                            </select>
                                        </td>
                                        <td>
                                            <input
                                                type="number"
                                                step="0.01"
                                                name="basisPrice"
                                                required
                                                class="form-input text-right"
                                            />
                                        </td>
                                        <td>
                                            <div class="sizes-container">
                                                <div class="size-row">
                                                    <input
                                                        type="text"
                                                        name="sizeName"
                                                        placeholder="S"
                                                        class="form-input small-input"
                                                        style="width: 40px"
                                                    />
                                                    <input
                                                        type="number"
                                                        name="quantity"
                                                        placeholder="0"
                                                        min="0"
                                                        class="form-input small-input text-right"
                                                        style="width: 50px"
                                                    />
                                                    <button
                                                        type="button"
                                                        class="btn btn-icon add-size-btn"
                                                        onclick="addSizeRow(this)"
                                                    >
                                                        <i
                                                            class="fa-solid fa-plus"
                                                        ></i>
                                                    </button>
                                                </div>
                                            </div>
                                        </td>
                                        <td>
                                            <textarea
                                                name="description"
                                                rows="2"
                                                class="form-textarea"
                                            ></textarea>
                                        </td>
                                        <td>
                                            <input
                                                type="file"
                                                name="images"
                                                multiple
                                                accept="image/*"
                                                class="form-file"
                                            />
                                        </td>
                                        <td class="text-center">
                                            <button
                                                type="button"
                                                class="btn btn-icon remove-row remove-product-btn"
                                                onclick="removeRow(this)"
                                            >
                                                <i
                                                    class="fa-solid fa-trash-can"
                                                ></i>
                                            </button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <div
                            id="successMessage"
                            class="alert alert-success"
                            style="display: none"
                        >
                            Đã lưu thành công! Biên lai nhập kho đã được tạo
                            theo nhà cung cấp.
                        </div>

                        <div class="form-submit-area">
                            <button
                                type="button"
                                class="btn btn-success submit-all"
                                onclick="submitForm()"
                            >
                                <i class="fa-solid fa-floppy-disk"></i> LƯU TẤT
                                CẢ
                            </button>
                        </div>
                    </form>

                    <div id="providerModal" class="modal">
                        <div class="modal-content">
                            <span
                                class="close-btn"
                                onclick="closeModal('providerModal')"
                                ><i class="fa-solid fa-xmark"></i
                            ></span>
                            <h4 class="modal-title">Thêm Nhà cung cấp</h4>
                            <input
                                type="text"
                                id="newProviderName"
                                placeholder="Tên NCC"
                                required
                                class="form-input"
                            />
                            <input
                                type="email"
                                id="newProviderEmail"
                                placeholder="Email"
                                class="form-input"
                            />
                            <input
                                type="text"
                                id="newProviderPhone"
                                placeholder="SĐT"
                                class="form-input"
                            />
                            <input
                                type="text"
                                id="newProviderAddress"
                                placeholder="Địa chỉ"
                                class="form-input"
                            />
                            <button
                                type="button"
                                onclick="saveProvider()"
                                class="btn btn-primary modal-save-btn"
                            >
                                Lưu
                            </button>
                        </div>
                    </div>

                    <div id="genreModal" class="modal">
                        <div class="modal-content">
                            <span
                                class="close-btn"
                                onclick="closeModal('genreModal')"
                                ><i class="fa-solid fa-xmark"></i
                            ></span>
                            <h4 class="modal-title">Thêm Thể loại</h4>
                            <input
                                type="text"
                                id="newGenre"
                                placeholder="Tên thể loại"
                                required
                                class="form-input"
                            />
                            <button
                                type="button"
                                onclick="saveGenre()"
                                class="btn btn-primary modal-save-btn"
                            >
                                Lưu
                            </button>
                        </div>
                    </div>
                </div>
            </main>
            <div th:replace="Admin/footer :: Footer"></div>
        </div>

        <script th:inline="javascript">
            // ... TOÀN BỘ JAVASCRIPT LOGIC GIỮ NGUYÊN (như file gốc) ...
            const productSuggestions = /*[[${productSuggestions}]]*/ {};

            function submitForm() {
                const form = document.getElementById("multiProductForm");
                let valid = true;

                document
                    .querySelectorAll(
                        "#productTable tbody tr:not([style*='display: none'])"
                    )
                    .forEach((row) => {
                        const hasSize = Array.from(
                            row.querySelectorAll(".size-row")
                        ).some((sizeRow) => {
                            const name = sizeRow
                                .querySelector('input[name="sizeName"]')
                                ?.value.trim();
                            const qty = sizeRow.querySelector(
                                'input[name="quantity"]'
                            )?.value;
                            return name && qty > 0;
                        });
                        if (!hasSize) valid = false;
                    });

                if (!valid) {
                    alert("Mỗi sản phẩm cần ít nhất 1 size có số lượng > 0!");
                    return;
                }

                form.submit();
                document.getElementById("successMessage").style.display =
                    "block";
            }

            // Các hàm JS: addProductRow, addSizeRow, removeRow, open/closeModal, saveProvider, saveGenre, load/showSuggestions

            function addProductRow() {
                const tbody = document.querySelector("#productTable tbody");
                const template = tbody
                    .querySelector(".product-row")
                    .cloneNode(true);
                template.style.display = "table-row"; // Cập nhật style.display

                // Reset tất cả input/select
                template
                    .querySelectorAll("input, select, textarea")
                    .forEach((el) => {
                        if (el.type === "file") el.value = "";
                        else if (el.tagName === "SELECT") {
                            el.selectedIndex = 0; // Chọn option đầu (disabled)
                        } else {
                            el.value = "";
                        }
                    });
                // Reset size
                const container = template.querySelector(".sizes-container");
                container.innerHTML = `<div class="size-row">
          <input type="text" name="sizeName" placeholder="S" class="form-input small-input" style="width:40px" />
          <input type="number" name="quantity" placeholder="0" min="0" class="form-input small-input text-right" style="width:50px" />
          <button type="button" class="btn btn-icon add-size-btn" onclick="addSizeRow(this)"><i class="fa-solid fa-plus"></i></button>
        </div>`;

                tbody.appendChild(template);
            }

            function addSizeRow(btn) {
                const container = btn.closest(".sizes-container");
                const row = document.createElement("div");
                row.className = "size-row";
                row.innerHTML = `
            <input type="text" name="sizeName" placeholder="M" class="form-input small-input" style="width:40px" />
            <input type="number" name="quantity" placeholder="0" min="0" class="form-input small-input text-right" style="width:50px" />
            <button type="button" class="btn btn-icon remove-size-btn" onclick="this.parentElement.remove()"><i class="fa-solid fa-minus"></i></button>
        `;
                container.appendChild(row);
            }
            function removeRow(btn) {
                // Chỉ xóa nếu có nhiều hơn 1 dòng hiển thị
                if (
                    document.querySelectorAll(
                        "#productTable tbody tr:not([style*='display: none'])"
                    ).length <= 1
                ) {
                    alert("Phải có ít nhất 1 sản phẩm!");
                    return;
                }
                btn.closest("tr").remove();
            }
            function openProviderModal() {
                document.getElementById("providerModal").style.display = "flex";
            }
            function openGenreModal() {
                document.getElementById("genreModal").style.display = "flex";
            }
            function closeModal(id) {
                document.getElementById(id).style.display = "none";
            }

            function getCsrfToken() {
                const token = document
                    .querySelector('meta[name="csrf-token"]')
                    .getAttribute("content");
                const header = document
                    .querySelector('meta[name="csrf-header"]')
                    .getAttribute("content");
                return { token, header };
            }

            function saveProvider() {
                const { token, header } = getCsrfToken();
                const data = {
                    providerName: document
                        .getElementById("newProviderName")
                        .value.trim(),
                    providerEmail: document
                        .getElementById("newProviderEmail")
                        .value.trim(),
                    providerPhone: document
                        .getElementById("newProviderPhone")
                        .value.trim(),
                    providerAddress: document
                        .getElementById("newProviderAddress")
                        .value.trim(),
                };
                if (!data.providerName) return alert("Nhập tên NCC!");

                fetch("/Admin/addProvider", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        [header]: token,
                    },
                    body: JSON.stringify(data),
                })
                    .then((r) => r.json())
                    .then((p) => {
                        document
                            .querySelectorAll('select[name="providerId"]')
                            .forEach((s) => {
                                s.add(new Option(p.providerName, p.providerId));
                                s.value = p.providerId;
                            });
                        closeModal("providerModal");
                        document
                            .querySelectorAll("#providerModal input")
                            .forEach((i) => (i.value = ""));
                    });
            }

            function saveGenre() {
                const { token, header } = getCsrfToken();
                const name = document.getElementById("newGenre").value.trim();
                if (!name) return alert("Nhập thể loại!");

                fetch("/Admin/addGenre", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        [header]: token,
                    },
                    body: JSON.stringify({ genre: name }),
                })
                    .then((r) => r.json())
                    .then((g) => {
                        document
                            .querySelectorAll('select[name="genreId"]')
                            .forEach((s) => {
                                s.add(new Option(g.genreName, g.genreId));
                                s.value = g.genreId;
                            });
                        closeModal("genreModal");
                        document.getElementById("newGenre").value = "";
                    });
            }

            function loadProductSuggestions(select) {
                const suggestions = productSuggestions[select.value] || [];
                select
                    .closest("tr")
                    .querySelector(
                        'input[name="productName"]'
                    ).dataset.suggestions = JSON.stringify(suggestions);
            }

            function showSuggestions(input) {
                const suggestions = JSON.parse(
                    input.dataset.suggestions || "[]"
                );
                const val = input.value.toLowerCase();
                const container = input.nextElementSibling;
                container.innerHTML = "";
                if (!val) return;

                suggestions
                    .filter((p) => p.productName.toLowerCase().includes(val))
                    .slice(0, 5)
                    .forEach((p) => {
                        const div = document.createElement("div");
                        div.innerHTML = `<strong>${p.productName}</strong><br><small>Mã: ${p.productId} | Giá: ${p.basisPrice}</small>`;
                        div.onclick = () => {
                            input.value = p.productName;
                            input
                                .closest("tr")
                                .querySelector('select[name="genreId"]').value =
                                p.genreId;
                            input
                                .closest("tr")
                                .querySelector(
                                    'input[name="basisPrice"]'
                                ).value = p.basisPrice;
                            container.innerHTML = "";
                        };
                        container.appendChild(div);
                    });
            }

            window.onload = () => addProductRow();
        </script>
    </body>
</html>
