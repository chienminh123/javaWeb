<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Kiểm Kê Tồn Kho</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA== "
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" th:href="@{/assets/css/admin.css}" />
  </head>
  <body class="admin-layout">
    <div th:replace="Admin/sidebar :: sideBar"></div>
    <div class="admin-content-wrapper">
      <div th:replace="Admin/header :: Header"></div>

      <main class="admin-main">
        <div class="inventory-check-container">
          <h2 class="page-title">
            <i class="fa-solid fa-list-check"></i> KIỂM KÊ TỒN KHO
          </h2>
          <a href="/Admin/export/stocktake" style="text-decoration: none">
            <button
              type="button"
              style="
                background: #007bff;
                color: white;
                padding: 10px 20px;
                border: none;
                cursor: pointer;
                border-radius: 4px;
              "
            >
              📥 Tải Phiếu Kiểm Kê (Excel)
            </button>
          </a>
          <p class="check-info">
            Ngày kiểm:
            <strong
              th:text="${#dates.format(#dates.createNow(), 'dd/MM/yyyy HH:mm')}"
            ></strong>
          </p>

          <form
            id="checkForm"
            th:action="@{/Admin/saveInventoryCheck}"
            method="post"
          >
            <div class="table-wrapper">
              <table id="checkTable" class="data-table check-table">
                <thead>
                  <tr>
                    <th style="width: 3%">STT</th>
                    <th style="width: 15%">Nhà cung cấp</th>
                    <th style="width: 25%">Sản phẩm</th>
                    <th style="width: 5%">Size</th>
                    <th style="width: 10%">Tồn hệ thống</th>
                    <th style="width: 10%">Tồn thực tế</th>
                    <th style="width: 10%">Chênh lệch</th>
                    <th style="width: 22%">Ghi chú lý do</th>
                  </tr>
                </thead>
                <tbody>
                  <tr th:each="p, iter : ${productsWithSizes}">
                    <td
                      th:text="${iter.index + 1}"
                      class="row-header stt-cell"
                    ></td>

                    <td
                      th:text="${p.provider.providerName}"
                      class="row-header provider-cell"
                    ></td>

                    <td
                      th:text="${p.productName}"
                      class="row-header product-name-cell"
                    ></td>

                    <th:block th:if="${p.sizes.size() > 0}">
                      <td colspan="5" class="size-detail-cell">
                        <div class="size-group-container">
                          <div th:each="size : ${p.sizes}" class="size-row">
                            <strong
                              th:text="${size.sizeName}"
                              class="size-name"
                            ></strong>

                            <input
                              type="hidden"
                              name="productId"
                              th:value="${p.productId}"
                            />
                            <input
                              type="hidden"
                              name="sizeName"
                              th:value="${size.sizeName}"
                            />
                            <input
                              type="hidden"
                              name="systemQty"
                              th:value="${size.quantity}"
                            />

                            <span
                              th:text="${size.quantity}"
                              class="system-qty"
                            ></span>

                            <input
                              type="number"
                              name="actualQty"
                              th:value="${size.quantity}"
                              th:data-system="${size.quantity}"
                              onchange="calcDiff(this)"
                              class="form-input actual-qty-input"
                              required
                            />

                            <span class="diff diff-display">0</span>

                            <textarea
                              name="note"
                              placeholder="Lý do..."
                              th:if="${size.quantity != 0}"
                              class="form-textarea diff-note"
                            ></textarea>
                            <div
                              th:unless="${size.quantity != 0}"
                              class="diff-note-placeholder"
                            ></div>
                          </div>
                        </div>
                      </td>
                    </th:block>

                    <th:block th:if="${p.sizes.size() == 0}">
                      <td colspan="5" class="no-size-data">
                        Sản phẩm chưa thiết lập phân loại size
                      </td>
                    </th:block>
                  </tr>
                </tbody>
              </table>
            </div>

            <div class="form-submit-area">
              <button type="submit" class="btn btn-success save-btn">
                <i class="fa-solid fa-clipboard-check"></i> HOÀN TẤT KIỂM KÊ
              </button>
            </div>
          </form>
        </div>
      </main>

      <div th:replace="Admin/footer :: Footer"></div>
    </div>

    <script>
      function calcDiff(input) {
        const system = parseInt(input.dataset.system) || 0;
        const actual = parseInt(input.value) || 0;
        const diff = actual - system;

        // Tìm span.diff-display trong size-row
        const sizeRow = input.closest(".size-row");
        const span = sizeRow.querySelector(".diff-display");

        span.textContent = diff;
        span.className =
          "diff diff-display " +
          (diff > 0 ? "diff-positive" : diff < 0 ? "diff-negative" : "");

        // Tự động gợi ý ghi chú nếu thừa/thiếu
        const textarea = sizeRow.querySelector("textarea[name='note']");

        if (textarea) {
          if (
            diff < 0 &&
            (!textarea.value || textarea.value.includes("Hao hụt"))
          ) {
            textarea.value = "Hao hụt do bảo quản / vận chuyển";
          } else if (
            diff > 0 &&
            (!textarea.value || textarea.value.includes("Nhập thêm"))
          ) {
            textarea.value = "Nhập bổ sung chưa cập nhật";
          } else if (diff === 0) {
            textarea.value = ""; // Xóa ghi chú nếu không có chênh lệch
          }
        }
      }

      // Khởi tạo tính toán chênh lệch khi tải trang (nếu có giá trị)
      window.onload = function () {
        document.querySelectorAll(".actual-qty-input").forEach((input) => {
          // Chỉ tính toán nếu input đã có giá trị (ví dụ: đang sửa phiếu kiểm kê dở)
          if (input.value) {
            calcDiff(input);
          }
        });
      };
    </script>
  </body>
</html>
