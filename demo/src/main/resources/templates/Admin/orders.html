<!DOCTYPE html>
<html
  lang="vi"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
>
  <head>
    <meta charset="UTF-8" />
    <title th:text="${pageTitle}">Danh sách Đơn hàng</title>

    <link rel="stylesheet" th:href="@{/assets/css/admin.css}" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <style>
      /* CSS riêng cho trang Order giữ nguyên */
      .orders-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
        background-color: white;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      .orders-table th,
      .orders-table td {
        border: 1px solid #ddd;
        padding: 16px;
        text-align: left;
        font-size: 18px;
      }
      .orders-table th {
        background-color: #f2f2f2;
        font-weight: bold;
      }
      .orders-table tr:nth-child(even) {
        background-color: #f9f9f9;
      }
      .orders-table tr:hover {
        background-color: #f1f1f1;
      }
      .status-badge {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 4px;
        font-size: 16px;
        font-weight: bold;
        color: white;
      }

      /* Màu trạng thái */
      .status-Đã_hủy,
      .status-Đã_trả_hàng {
        background-color: #ff4d4f;
      }
      .status-Mới_tạo,
      .status-Thanh_toán_thất_bại {
        background-color: #8d8c8b;
      }
      .status-Chờ_thanh_toán,
      .status-Đã_thanh_toán_VNPay,
      .status-Đang_xử_lý {
        background-color: #faad14;
      }
      .status-Giao_hàng_thành_công,
      .status-Đang_chuẩn_bị,
      .status-Đã_xác_nhận,
      .status-Đang_giao_hàng {
        background-color: #52c41a;
      }
      .detail-btn {
        background-color: #1890ff;
        color: white;
        border: none;
        padding: 6px 10px;
        border-radius: 4px;
        cursor: pointer;
        text-decoration: none;
        font-size: 16px;
      }

      .btn-back {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        background-color: #6c757d; /* Màu xám trung tính */
        color: white;
        border-radius: 4px;
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
        margin-bottom: 15px; /* Cách tiêu đề một chút */
        transition: background-color 0.2s;
        width: fit-content;
      }
      .btn-back:hover {
        background-color: #5a6268; /* Màu xám đậm hơn khi hover */
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="admin-layout">
      <div th:replace="Admin/sidebar::sideBar"></div>

      <div class="admin-content-wrapper">
        <div th:replace="Admin/header::Header"></div>

        <main class="admin-main">
          <div class="dashboard-content">
            <a th:href="@{/Admin/home}" class="btn-back">
              <i class="fas fa-arrow-left"></i> Quay lại trang chủ
            </a>
            <h1>
              <i class="fas fa-file-invoice-dollar"></i> Danh sách Đơn hàng
            </h1>
            <!-- <p th:text="${pageTitle}"></p> -->

            <table class="orders-table">
              <thead>
                <tr>
                  <th>Mã ĐH</th>
                  <th>Mã User</th>
                  <th>Ngày đặt hàng</th>
                  <th>Tổng tiền</th>
                  <th>Trạng thái</th>
                  <th>Thao tác</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="order : ${orders}">
                  <td th:text="${order.orderId}">#1001</td>
                  <td th:text="${order.user?.userId}">U001</td>
                  <td
                    th:text="${#temporals.format(order.orderDate, 'dd/MM/yyyy HH:mm')}"
                  >
                    12/11/2025 10:00
                  </td>
                  <td
                    th:with="subTotal=${#aggregates.sum(order.orderDetails.![price * quantity])},
             discount=${order.discountAmount != null ? order.discountAmount : 0},
             finalTotal=${subTotal - discount}"
                  >
                    <span
                      th:text="${#numbers.formatDecimal(finalTotal, 0, 'COMMA', 0, 'POINT')} + ' đ'"
                    ></span>
                    <div
                      th:if="${discount > 0}"
                      style="
                        font-size: 14px;
                        color: #888;
                        text-decoration: line-through;
                      "
                    >
                      <span
                        th:text="${#numbers.formatDecimal(subTotal, 0, 'COMMA', 0, 'POINT')} + ' đ'"
                      ></span>
                    </div>
                  </td>
                  <td>
                    <span
                      class="status-badge"
                      th:classappend="'status-' + ${#strings.replace(order.status, ' ', '_')}"
                      th:text="${order.status}"
                    >
                      Đang xử lý
                    </span>
                  </td>
                  <td>
                    <a
                      th:href="@{/Admin/order-detail(orderId=${order.orderId})}"
                      class="detail-btn"
                      >Chi tiết</a
                    >
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </main>

        <div th:replace="Admin/footer::Footer"></div>
      </div>
    </div>
  </body>
</html>
