<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Quản Lý Tồn Kho</title>

    <style>
      /* (CSS giữ nguyên như cũ) */
      .container {
        margin-left: 270px;
        padding: 20px;
      }
      .filters {
        display: flex;
        gap: 15px;
        margin-bottom: 20px;
        flex-wrap: wrap;
        align-items: center;
      }
      .filters select,
      .filters input {
        font-size: 14px;
        padding: 6px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 10px;
        text-align: left;
      }
      th {
        background-color: #f2f2f2;
      }
      .size-item {
        margin: 3px 0;
        font-size: 13px;
      }
      .size-item.in-stock {
        color: #27ae60;
        font-weight: bold;
      }
      .size-item.out-of-stock {
        color: #aaa;
      }
      .product-image {
        width: 70px;
        height: auto;
        border-radius: 4px;
      }
      .no-data {
        text-align: center;
        color: #999;
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <div th:replace="Admin/header :: Header"></div>
    <div th:replace="Admin/sidebar :: sideBar"></div>

    <div class="container" th:fragment="tonkhoContent">
      <h2>Quản Lý Tồn Kho</h2>

      <div class="filters">
        <div>
          <label>NCC:</label>
          <select id="filterProvider">
            <option value="">Tất cả</option>
            <option
              th:each="p : ${providers}"
              th:value="${p.providerId}"
              th:text="${p.providerName}"
            ></option>
          </select>
        </div>
        <div>
          <label>Thể loại:</label>
          <select id="filterGenre">
            <option value="">Tất cả</option>
            <option
              th:each="g : ${genres}"
              th:value="${g.genreId}"
              th:text="${g.genreName}"
            ></option>
          </select>
        </div>
        <div>
          <label>Tìm tên SP:</label>
          <input type="text" id="searchName" placeholder="Nhập tên..." />
        </div>
        <div>
          <label>Tình trạng:</label>
          <select id="stockFilter">
            <option value="all">Tất cả</option>
            <option value="in_stock">Còn hàng</option>
            <option value="out_of_stock">Hết hàng</option>
          </select>
        </div>
        <button onclick="applyFilters()" style="padding: 8px 15px">Lọc</button>
        <button
          onclick="resetFilters()"
          style="padding: 8px 15px; background: #ccc"
        >
          Xóa lọc
        </button>
        <a href="/Admin/export/inventory" style="text-decoration: none">
          <button
            type="button"
            style="
              padding: 8px 15px;
              background-color: #28a745;
              color: white;
              border: none;
              cursor: pointer;
              border-radius: 4px;
            "
          >
            Xuất Excel
          </button>
        </a>
      </div>

      <table id="inventoryTable">
        <thead>
          <tr>
            <th>STT</th>
            <th>Nhà cung cấp</th>
            <th>Tên Sản Phẩm</th>
            <th>Thể Loại</th>
            <th>Size & SL Tồn</th>
            <th>Hình ảnh</th>
          </tr>
        </thead>
        <tbody id="inventoryTableBody"></tbody>
      </table>
    </div>

    <div th:replace="Admin/footer :: Footer"></div>

    <script th:inline="javascript">
      // DỮ LIỆU TỪ SERVER
      const products = /*[[${products}]]*/ [];
      const providers = /*[[${providers}]]*/ [];
      const genres = /*[[${genres}]]*/ [];

      // HÀM RENDER BẢNG (Giữ nguyên)
      function renderTable(filteredProducts) {
        // (Code renderTable giữ nguyên, không cần sửa)
        const tbody = document.getElementById("inventoryTableBody");
        tbody.innerHTML = "";
        if (filteredProducts.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" class="no-data">Không có sản phẩm nào phù hợp</td></tr>`;
          return;
        }
        filteredProducts.forEach((p, index) => {
          const providerName =
            providers.find((pr) => pr.providerId === p.provider.providerId)
              ?.providerName || "N/A";
          const genreName =
            genres.find((g) => g.genreId === p.genre.genreId)?.genreName ||
            "N/A";
          let sizeHtml = "";
          if (p.sizes && p.sizes.length > 0) {
            p.sizes.forEach((size) => {
              const stockClass =
                size.quantity > 0 ? "in-stock" : "out-of-stock";
              const stockText = size.quantity > 0 ? size.quantity : "Hết";
              sizeHtml += `<div class="size-item ${stockClass}">${size.sizeName}: ${stockText}</div>`;
            });
          } else {
            sizeHtml = `<div class="size-item out-of-stock">Chưa có size</div>`;
          }
          const imgHtml = p.imageUrl
            ? `<img src="${p.imageUrl}" alt="SP" class="product-image" />`
            : `<span>Không có ảnh</span>`;
          const row = document.createElement("tr");
          row.innerHTML = `
          <td>${index + 1}</td>
          <td>${providerName}</td>
          <td>${p.productName}</td>
          <td>${genreName}</td>
          <td>${sizeHtml}</td>
          <td>${imgHtml}</td>
        `;
          tbody.appendChild(row);
        });
      }

      // HÀM LỌC (Giữ nguyên)
      function applyFilters() {
        let filtered = products;
        const providerId = document.getElementById("filterProvider").value;
        const genreId = document.getElementById("filterGenre").value;
        const searchText = document
          .getElementById("searchName")
          .value.toLowerCase();
        const stockStatus = document.getElementById("stockFilter").value;

        if (providerId) {
          filtered = filtered.filter(
            (p) => p.provider.providerId == providerId
          );
        }
        if (genreId) {
          filtered = filtered.filter((p) => p.genre.genreId == genreId);
        }
        if (searchText) {
          filtered = filtered.filter((p) =>
            p.productName.toLowerCase().includes(searchText)
          );
        }
        if (stockStatus === "in_stock") {
          filtered = filtered.filter(
            (p) => p.sizes && p.sizes.some((s) => s.quantity > 0)
          );
        } else if (stockStatus === "out_of_stock") {
          filtered = filtered.filter(
            (p) =>
              !p.sizes ||
              p.sizes.length === 0 ||
              p.sizes.every((s) => s.quantity <= 0)
          );
        }
        renderTable(filtered);
      }

      // HÀM RESET LỌC (Giữ nguyên)
      function resetFilters() {
        document.getElementById("filterProvider").value = "";
        document.getElementById("filterGenre").value = "";
        document.getElementById("searchName").value = "";
        document.getElementById("stockFilter").value = "all"; // Reset về "Tất cả"
        applyFilters(); // Chạy lại bộ lọc (sẽ hiển thị tất cả)
      }

      // === SỬA LỖI HÀM NÀY: Đọc URL khi tải trang ===
      window.onload = () => {
        // 1. Đọc tham số 'filter' từ URL
        const urlParams = new URLSearchParams(window.location.search);
        const filterParam = urlParams.get("filter"); // (VD: 'out_of_stock' hoặc null)

        if (filterParam === "out_of_stock") {
          // 2a. Nếu link từ trang Home, đặt dropdown là "Hết hàng"
          document.getElementById("stockFilter").value = "out_of_stock";
        } else {
          // 2b. Mặc định (truy cập trực tiếp), đặt là "Tất cả"
          document.getElementById("stockFilter").value = "all";
        }

        // 3. Chạy bộ lọc dựa trên giá trị đã đặt
        applyFilters();
      };
      // === KẾT THÚC SỬA LỖI ===
    </script>
  </body>
</html>
