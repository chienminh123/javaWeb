<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Quản Lý Tồn Kho</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA== "
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" th:href="@{/assets/css/admin.css}" />
  </head>
  <body class="admin-layout">
    <div th:replace="Admin/sidebar :: sideBar"></div>

    <div class="admin-content-wrapper">
      <div th:replace="Admin/header :: Header"></div>

      <main class="admin-main">
        <div class="inventory-container" th:fragment="tonkhoContent">
          <h2><i class="fa-solid fa-warehouse"></i> Quản Lý Tồn Kho</h2>

          <div class="filters">
            <div class="filter-group">
              <label for="filterProvider">NCC:</label>
              <select id="filterProvider">
                <option value="">Tất cả</option>
                <option
                  th:each="p : ${providers}"
                  th:value="${p.providerId}"
                  th:text="${p.providerName}"
                ></option>
              </select>
            </div>
            <div class="filter-group">
              <label for="filterGenre">Thể loại:</label>
              <select id="filterGenre">
                <option value="">Tất cả</option>
                <option
                  th:each="g : ${genres}"
                  th:value="${g.genreId}"
                  th:text="${g.genreName}"
                ></option>
              </select>
            </div>
            <div class="filter-group">
              <label for="searchName">Tìm tên SP:</label>
              <input type="text" id="searchName" placeholder="Nhập tên..." />
            </div>
            <div class="filter-group">
              <label for="stockFilter">Tình trạng:</label>
              <select id="stockFilter">
                <option value="all">Tất cả</option>
                <option value="in_stock">Còn hàng</option>
                <option value="out_of_stock">Hết hàng</option>
              </select>
            </div>
            <div class="filter-buttons">
              <button onclick="applyFilters()">Lọc</button>
              <button onclick="resetFilters()">Xóa lọc</button>
            </div>
            <a href="/Admin/export/inventory" style="text-decoration: none">
              <button
                type="button"
                style="
                  padding: 8px 15px;
                  background-color: #28a745;
                  color: white;
                  border: none;
                  cursor: pointer;
                  border-radius: 4px;
                "
              >
                Xuất Excel
              </button>
            </a>
          </div>

          <div class="inventory-table-wrapper">
            <table id="inventoryTable">
              <thead>
                <tr>
                  <th>STT</th>
                  <th>Nhà cung cấp</th>
                  <th>Tên Sản Phẩm</th>
                  <th>Thể Loại</th>
                  <th>Size & SL Tồn</th>
                  <th>Hình ảnh</th>
                </tr>
              </thead>
              <tbody id="inventoryTableBody"></tbody>
            </table>
          </div>
        </div>
      </main>

      <div th:replace="Admin/footer :: Footer"></div>
    </div>

    <script th:inline="javascript">
      // DỮ LIỆU TỪ SERVER (Giữ nguyên)
      const products = /*[[${products}]]*/ [];
      const providers = /*[[${providers}]]*/ [];
      const genres = /*[[${genres}]]*/ [];

      // HÀM RENDER BẢNG (Giữ nguyên)
      function renderTable(filteredProducts) {
        // (Code renderTable giữ nguyên)
        const tbody = document.getElementById("inventoryTableBody");
        tbody.innerHTML = "";
        if (filteredProducts.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" class="no-data">Không có sản phẩm nào phù hợp</td></tr>`;
          return;
        }
        filteredProducts.forEach((p, index) => {
          const providerName =
            providers.find((pr) => pr.providerId === p.provider.providerId)
              ?.providerName || "N/A";
          const genreName =
            genres.find((g) => g.genreId === p.genre.genreId)?.genreName ||
            "N/A";
          let sizeHtml = "";
          if (p.sizes && p.sizes.length > 0) {
            p.sizes.forEach((size) => {
              const stockClass =
                size.quantity > 0 ? "in-stock" : "out-of-stock";
              // Chỉnh sửa để có khoảng cách giữa tên size và số lượng
              const stockText = size.quantity > 0 ? size.quantity : "Hết";
              sizeHtml += `<div class="size-item ${stockClass}"><span>${size.sizeName}:</span> ${stockText}</div>`;
            });
          } else {
            sizeHtml = `<div class="size-item out-of-stock">Chưa có size</div>`;
          }
          const imgHtml = p.imageUrl
            ? `<img src="${p.imageUrl}" alt="SP" class="product-image" />`
            : `<span>Không có ảnh</span>`;
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${index + 1}</td>
            <td>${providerName}</td>
            <td>${p.productName}</td>
            <td>${genreName}</td>
            <td>${sizeHtml}</td>
            <td>${imgHtml}</td>
          `;
          tbody.appendChild(row);
        });
      }

      // HÀM LỌC (Giữ nguyên)
      function applyFilters() {
        // (Code applyFilters giữ nguyên)
        let filtered = products;
        const providerId = document.getElementById("filterProvider").value;
        const genreId = document.getElementById("filterGenre").value;
        const searchText = document
          .getElementById("searchName")
          .value.toLowerCase();
        const stockStatus = document.getElementById("stockFilter").value;

        if (providerId) {
          filtered = filtered.filter(
            (p) => p.provider.providerId == providerId
          );
        }
        if (genreId) {
          filtered = filtered.filter((p) => p.genre.genreId == genreId);
        }
        if (searchText) {
          filtered = filtered.filter((p) =>
            p.productName.toLowerCase().includes(searchText)
          );
        }
        if (stockStatus === "in_stock") {
          filtered = filtered.filter(
            (p) => p.sizes && p.sizes.some((s) => s.quantity > 0)
          );
        } else if (stockStatus === "out_of_stock") {
          filtered = filtered.filter(
            (p) =>
              !p.sizes ||
              p.sizes.length === 0 ||
              p.sizes.every((s) => s.quantity <= 0)
          );
        }
        renderTable(filtered);
      }

      // HÀM RESET LỌC (Giữ nguyên)
      function resetFilters() {
        // (Code resetFilters giữ nguyên)
        document.getElementById("filterProvider").value = "";
        document.getElementById("filterGenre").value = "";
        document.getElementById("searchName").value = "";
        document.getElementById("stockFilter").value = "all";
        applyFilters();
      }

      // ĐỌC URL KHI TẢI TRANG (Đã sửa lỗi)
      window.onload = () => {
        const urlParams = new URLSearchParams(window.location.search);
        const filterParam = urlParams.get("filter");

        if (filterParam === "out_of_stock") {
          document.getElementById("stockFilter").value = "out_of_stock";
        } else {
          document.getElementById("stockFilter").value = "all";
        }

        applyFilters();
      };
    </script>
  </body>
</html>
